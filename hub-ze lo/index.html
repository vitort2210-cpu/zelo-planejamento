// Ciclos de 2026 (jun→dez). Jun–Ago é o planejamento em andamento; os rótulos dos
// ciclos 1 e 2 ficam sem tema de propósito — serão nomeados ao montar cada grade.
const CICLOS_2026 = [
  { periodo:'Junho — Agosto 2026',      ciclo:'Ciclo 1 · Brincar é direito, não concessão', docId:'junho-agosto-2026', ano:2026 },
  { periodo:'Setembro — Outubro 2026',  ciclo:'Ciclo 2 · Infâncias no Plural',    docId:'setembro-outubro-2026', ano:2026 },
  { periodo:'Novembro — Dezembro 2026', ciclo:'Ciclo 3 · Do balanço ao recomeço', docId:'novembro-dezembro-2026', ano:2026 },
];
// Cadastra os ciclos de 2026 + 2027 uma única vez, preservando status, a grade de
// cada ciclo (docId inalterado) e quaisquer ciclos extras criados à mão.
function migrarCiclos() {
  if (estado.planVersion === '2026-2027c') return false;
  const antigos = estado.planejamentos || [];
  const base = [...CICLOS_2026, ...CICLOS_2027];
  const previstos = base.map(c => c.docId);
  const cadastrados = base.map(c => {
    const old = antigos.find(p => cicloDocId(p) === c.docId);
    return { periodo:c.periodo, ciclo:c.ciclo, docId:c.docId, ano:c.ano, status:(old && old.status) || 'em andamento' };
  });
  const extras = antigos
    .filter(p => !previstos.includes(cicloDocId(p)))
    .map(p => ({ ...p, ano: anoCiclo(p) }));
  estado.planejamentos = [...cadastrados, ...extras];
  estado.planVersion = '2026-2027c';
  return true;
}

// ── PAINEL DE PENDÊNCIAS (topo da Base de Dados, que é a aba de entrada) ──────
// Lê o cache que o assistente já monta (todos os ciclos) e responde a uma única
// pergunta: o que está esperando por MIM? Cada linha leva direto ao lugar certo,
// já com o filtro aplicado. Substitui o e-mail automático que o Vitor desligou.
// Os três painéis do topo da Base de Dados abrem fechados: a aba é a porta de
// entrada do HUB e três listas abertas de uma vez empurram todo o resto da
// página para baixo. Quem quer ver, clica — e o número no cabeçalho já diz se
// vale a pena.
let pendAberto = false;
let filtroPendente = null;   // status a aplicar assim que a aba de destino montar
function pendDataPassou(d, ano){
  const m=String(d||'').match(/^(\d{1,2})\/(\d{1,2})/); if(!m) return false;
  const hoje=new Date(); const alvo=new Date(ano || anoAtivo, +m[2]-1, +m[1]);
  return alvo <= hoje;
}
// ── Janela do painel: só o ciclo de agora e o seguinte ────────────────────────
// Listar tudo que existe (inclusive ciclo do ano que vem) transforma o painel em
// ruído. O que está "esperando você" é o que está em produção agora e o que vem
// logo depois — o resto ainda não é trabalho de hoje.
const MESES_NOME = { janeiro:1, fevereiro:2, marco:3, 'março':3, abril:4, maio:5, junho:6,
                     julho:7, agosto:8, setembro:9, outubro:10, novembro:11, dezembro:12 };
function cicloJanela(c){
  const txt = String(c.periodo || c.docId || '').toLowerCase();
  const meses = (txt.match(/[a-zçã]+/g) || []).map(w => MESES_NOME[w]).filter(Boolean);
  const ano = c.ano || anoCiclo({ periodo: c.periodo });
  if(!meses.length) return { ini: ano*12, fim: ano*12 + 11 };
  return { ini: ano*12 + meses[0], fim: ano*12 + meses[meses.length-1] };
}
function ciclosDoPainel(){
  const todos = (asstCache.cycles || []).map(c => ({ c, j: cicloJanela(c) }))
    .sort((a,b) => a.j.ini - b.j.ini);
  if(!todos.length) return [];
  const hoje = new Date();
  const agora = hoje.getFullYear()*12 + (hoje.getMonth()+1);
  // o ciclo que contém hoje; se não houver, o próximo que ainda vai começar
  let i = todos.findIndex(x => agora >= x.j.ini && agora <= x.j.fim);
  if(i < 0) i = todos.findIndex(x => x.j.ini > agora);
  if(i < 0) i = todos.length - 1;                 // tudo já passou: mostra o último
  return todos.slice(i, i + 2).map(x => x.c);
}
function pendCalcular(){
  const linhas=[];
  const add=(ico,txt,n,area,docId,filtro,urg)=>{ if(n>0) linhas.push({ico,txt,n,area,docId,filtro,urg}); };
  ciclosDoPainel().forEach(c=>{
    const its=c.items||[];
    const temTexto=(id)=>{ const x=c.copy[id]; return x && (x.legenda||x.reels||x.blog||(Array.isArray(x.slides)&&x.slides.some(s=>s.texto))); };
    const temArte=(id)=>{ const d=c.design[id]; return d && desMidias(d).length>0; };
    const gabi=(id)=>((c.copy[id]||{}).statusGabi||'');
    const des =(id)=>((c.design[id]||{}).statusDesign||'');
    const comDados=(id)=>postComDados(c.posts[id]);

    // Cada pessoa vê só o que é trabalho DELA:
    //  • Gabi   → material finalizado esperando a validação dela, e nada mais.
    //  • Bonina → texto já aprovado (é o sinal verde para produzir) + ajustes.
    //  • Vitor  → o processo inteiro, porque é quem coordena.
    const planPendente = its.filter(it=>!c.estados[it.id]).length;
    const textoPronto  = (id)=>temTexto(id) && !['aprovado','cancelado','revisao_necessaria'].includes(gabi(id));
    const artePronta   = (id)=>temArte(id)  && !['aprovado','ajustes_necessarios'].includes(des(id));

    if (ehCliente()) {
      add('📅', 'Planejamento do ciclo para validar', planPendente, 'plan', c.docId, null, true);
      add('✍️', 'Textos prontos esperando sua validação', its.filter(it=>textoPronto(it.id)).length, 'copy', c.docId, 'pendente', true);
      add('🎨', 'Artes e vídeos esperando sua validação', its.filter(it=>artePronta(it.id)).length, 'design', c.docId, 'pendente', true);
    } else if (ehVisualizador()) {
      // Texto aprovado pela Gabi = liberado para produzir. É a fila da Bonina.
      add('✅', 'Textos aprovados, prontos para produzir', its.filter(it=>gabi(it.id)==='aprovado' && !temArte(it.id)).length, 'copy', c.docId, 'aprovado', true);
      add('✏️', 'Artes com ajuste pedido pela Gabi', its.filter(it=>des(it.id)==='ajustes_necessarios').length, 'design', c.docId, 'ajustes', true);
    } else {
      add('✏️', 'Textos com ajuste pedido pela Gabi', its.filter(it=>gabi(it.id)==='revisao_necessaria').length, 'copy', c.docId, 'ajustes', true);
      add('✏️', 'Artes com ajuste pedido pela Gabi', its.filter(it=>des(it.id)==='ajustes_necessarios').length, 'design', c.docId, 'ajustes', true);
      add('📝', 'Conteúdos ainda sem copy', its.filter(it=>!temTexto(it.id)).length, 'copy', c.docId, 'semtexto', false);
      add('🖼', 'Textos aprovados ainda sem arte', its.filter(it=>gabi(it.id)==='aprovado' && !temArte(it.id)).length, 'design', c.docId, 'semtexto', false);
      add('📅', 'Planejamento esperando a Gabi validar', planPendente, 'plan', c.docId, null, false);
      add('⏳', 'Textos esperando a Gabi validar', its.filter(it=>textoPronto(it.id)).length, 'copy', c.docId, 'pendente', false);
      add('⏳', 'Artes esperando a Gabi validar', its.filter(it=>artePronta(it.id)).length, 'design', c.docId, 'pendente', false);
      add('📊', 'Já postados e ainda sem métrica', its.filter(it=>pendDataPassou(it.data, c.ano) && (temTexto(it.id)||temArte(it.id)) && !comDados(it.id)).length, 'metricas', c.docId, null, false);
    }
  });
  linhas.sort((a,b)=>(b.urg?1:0)-(a.urg?1:0));
  return linhas;
}
function renderPendencias(){
  const wrap=document.getElementById('pend-wrap'); if(!wrap) return;
  if(!asstCache.carregado){
    wrap.innerHTML=`<div class="pd-panel"><div class="pd-head"><span class="pd-ico">🧭</span><span class="pd-t">O que está esperando você</span><span class="pd-load">carregando…</span></div></div>`;
    return;
  }
  const linhas=pendCalcular();
  const total=linhas.reduce((a,l)=>a+l.n,0);
  const janela = ciclosDoPainel().map(c=>c.periodo).filter(Boolean).join(' · ');
  if(!total){
    wrap.innerHTML=`<div class="pd-panel ok"><div class="pd-head"><span class="pd-ico">✅</span><span class="pd-t">Tudo em dia por aqui</span>${janela?`<span class="pd-janela">${esc(janela)}</span>`:''}</div></div>`;
    return;
  }
  // O nome vem do cadastro de planejamentos; se o ciclo ainda não estiver lá,
  // usa o período que o próprio cache do assistente já conhece.
  const doCache=new Map(ciclosDoPainel().map(c=>[c.docId, c.periodo||'']));
  const nomeCiclo=(docId)=>{
    const p=(estado.planejamentos||[]).find(x=>cicloDocId(x)===docId);
    return (p && p.periodo) || doCache.get(docId) || '';
  };
  window.__pend = linhas;
  // Agrupa por ciclo: com dois ciclos na janela, repetir o nome embaixo de cada
  // linha virava ruído. Agora o nome é o cabeçalho do grupo e a linha fica limpa.
  let corpo = '';
  if(pendAberto){
    const ordem=[], porCiclo=new Map();
    linhas.forEach((l,i)=>{
      if(!porCiclo.has(l.docId)){ porCiclo.set(l.docId, []); ordem.push(l.docId); }
      porCiclo.get(l.docId).push({l,i});
    });
    corpo = `<div class="pd-body">${ordem.map(docId=>{
      const nome=nomeCiclo(docId);
      const cab = nome ? `<div class="pd-grupo">${esc(nome)}</div>` : '';
      return cab + porCiclo.get(docId).map(({l,i})=>
        `<button class="pd-row${l.urg?' urg':''}" onclick="irPend(${i})">
           <span class="pd-n">${l.n}</span>
           <span class="pd-txt">${l.ico} ${esc(l.txt)}</span>
           <span class="pd-go">→</span>
         </button>`).join('');
    }).join('')}</div>`;
  }
  // A faixa da janela explica por que só esses ciclos aparecem — é legenda da
  // lista. Com o painel fechado ela sobrava sozinha embaixo do cabeçalho e era
  // isso que deixava aquela faixa vazia.
  const faixa = (pendAberto && janela)
    ? `<div class="pd-janela-bar">Mostrando só o ciclo atual e o próximo</div>` : '';

function ensureAtaDoc(id){
  const a=(estado.atas||[]).find(x=>x.id===id) || { texto:'' };
  if(typeof a.texto!=='string') a.texto='';
  if(!Array.isArray(a.tabelas)) a.tabelas=[];
  if(!Array.isArray(a.imagens)) a.imagens=[];
  a.tabelas.forEach(t=>{
    if(!Array.isArray(t.cols)) t.cols=[];
    if(!Array.isArray(t.rows)) t.rows=[];
    // Firestore não aceita array dentro de array: cada linha é {cels:[...]}.
    t.rows=t.rows.map(r=>Array.isArray(r)?{cels:r.slice()}:(r&&Array.isArray(r.cels)?r:{cels:[]}));
  });
  return a;
}

// ── Seleção rápida por mês (Copy / Conteúdos) ─────────────────────────────────
// Um ciclo tem 2–3 meses. Abrir sempre no primeiro é pouco prático quando já se
// está no fim do bimestre — então filtra pelo mês e, ao abrir, já cai no mês de
// hoje se ele estiver no ciclo.
let mesFiltro = null;   // null = todos | 1..12
function mesDoItem(it) { const m = String((it && it.data) || '').match(/^(\d{1,2})\/(\d{1,2})/); return m ? +m[2] : 0; }
function mesesDoCiclo() {
  const s = new Set();
  (gradeItems || []).forEach(it => { const m = mesDoItem(it); if (m >= 1 && m <= 12) s.add(m); });
  return [...s].sort((a, b) => a - b);
}
// Conteúdo sem data entra em qualquer mês — assim nada some do filtro.
function itensDoMes() {
  if (!mesFiltro) return gradeItems || [];
  return (gradeItems || []).filter(it => { const m = mesDoItem(it); return !m || m === mesFiltro; });
}
// Ao abrir um ciclo: se o mês de hoje está no ciclo, começa nele; senão, "Todos".
function ajustarMesFiltroInicial() {
  const ms = mesesDoCiclo();
  const hoje = new Date().getMonth() + 1;
  mesFiltro = ms.includes(hoje) ? hoje : null;
  statusFiltro = 'todos';
  buscaFiltro = '';
  // Vindo do painel de pendências: mostra o ciclo inteiro já na gaveta pedida.
  if (filtroPendente) { statusFiltro = filtroPendente; mesFiltro = null; filtroPendente = null; }
}
function mesBarHTML() {
  const ms = mesesDoCiclo();
  if (ms.length < 2) return '';
  const total = (gradeItems || []).length;
  const chip = (m, lbl, n, on) => `<button class="mes-chip${on ? ' on' : ''}" onclick="setMesFiltro(${m})">${lbl}<span class="mes-n">${n}</span></button>`;
  return `<div class="mes-bar"><span class="mes-lbl">Ir para</span>${
    chip(0, 'Todos', total, !mesFiltro)
  }${ms.map(m => chip(m, MESES_ABR[m - 1], (gradeItems || []).filter(it => mesDoItem(it) === m).length, mesFiltro === m)).join('')}</div>`;
}
window.setMesFiltro = function(m) {
  mesFiltro = (m === 0 || m === mesFiltro) ? null : m;
  redesenharFiltros();
};

// ── Busca por título + filtro por status (Copy / Conteúdos) ───────────────────
let buscaFiltro = '';
let statusFiltro = 'todos';
function normTxt(s){ return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
// Situação de um conteúdo em cada aba, reduzida às 4 gavetas que interessam na
// hora de trabalhar: falta escrever/subir, esperando a Gabi, com ajuste, aprovado.
function situacaoCopy(it){
  const c=(copyData.itens||{})[it.id];
  const temTexto = c && (c.legenda || c.reels || c.blog || (Array.isArray(c.slides) && c.slides.some(s=>s.texto)));
  if(!temTexto) return 'semtexto';
  const g=c.statusGabi||'';
  if(g==='aprovado') return 'aprovado';
  if(g==='revisao_necessaria') return 'ajustes';
  if(g==='cancelado') return 'cancelado';
  return 'pendente';
}
function situacaoDesign(it){
  const d=(designData.itens||{})[it.id];
  if(!d || !desMidias(d).length) return 'semtexto';       // "sem arte"
  const s=d.statusDesign||'';
  if(s==='aprovado') return 'aprovado';
  if(s==='ajustes_necessarios') return 'ajustes';
  return 'pendente';
}
function situacaoDoItem(it){ return tabAtivo==='design' ? situacaoDesign(it) : situacaoCopy(it); }
const STATUS_OPCOES = () => tabAtivo==='design'
  ? [['todos','Tudo'],['semtexto','Sem arte'],['pendente','Aguardando a Gabi'],['ajustes','Com ajustes'],['aprovado','Aprovados']]
  : [['todos','Tudo'],['semtexto','Sem texto'],['pendente','Aguardando a Gabi'],['ajustes','Com ajustes'],['aprovado','Aprovados']];
function filtroBarHTML(){
  const base=itensDoMes();
  const cont=(k)=> k==='todos' ? base.length : base.filter(it=>situacaoDoItem(it)===k).length;
  const chips=STATUS_OPCOES().map(([k,lbl])=>{
    const n=cont(k);

    return `<button class="st-fchip${statusFiltro===k?' on':''}" onclick="setStatusFiltro('${k}')">${lbl}<span class="mes-n">${n}</span></button>`;
  }).join('');
  return `<div class="filtro-bar">
    <div class="busca-wrap">
      <span class="busca-ico">🔎</span>
      <input type="search" class="busca-inp" id="busca-copy" placeholder="Buscar por título, pilar ou formato…" value="${esc(buscaFiltro)}" oninput="setBuscaFiltro(this.value)">

    </div>
    <div class="st-fchips">${chips}</div>

}

  buscaFiltro = v;
  clearTimeout(buscaTimer);
  buscaTimer = setTimeout(()=>{

    if(inp && v){ inp.focus(); inp.setSelectionRange(v.length, v.length); }

// Aplica mês + busca + status, nessa ordem.
function itensVisiveis(){
  let lista=itensDoMes();
  if(statusFiltro!=='todos') lista=lista.filter(it=>situacaoDoItem(it)===statusFiltro);
  const q=normTxt(buscaFiltro).trim();
  if(q){
    const termos=q.split(/\s+/).filter(Boolean);
    lista=lista.filter(it=>{
      const hay=normTxt([it.titulo,it.pilar,it.formato,it.data].join(' '));
      return termos.every(t=>hay.includes(t));
    });
  }
  return lista;
}

// ── Carregamento cross-doc + tempo real ───────────────────────────────────────
async function carregarCiclo(docId) {
  copyCiclo = docId;
  gradeItems = [];
  copyData = { itens:{} };
  try {
    const gsnap = await getDoc(doc(db, 'planejamentos', docId));
    if (gsnap.exists() && Array.isArray(gsnap.data().items)) gradeItems = gsnap.data().items;
  } catch(e){ console.warn('Falha ao carregar grade do planejamento', e); }
  try {
    const csnap = await getDoc(copyRef(docId));
    if (csnap.exists()) copyData = { itens: csnap.data().itens || {} };
  } catch(e){ console.warn('Falha ao carregar copies', e); }
  designData = { itens:{} };
  try {
    const dsnap = await getDoc(designRef(docId));
    if (dsnap.exists()) designData = { itens: dsnap.data().itens || {} };
  } catch(e){ console.warn('Falha ao carregar design', e); }
  postsData = { itens:{}, ciclo:{} };
  try {
    const psnap = await getDoc(postsRef(docId));
    if (psnap.exists()) postsData = { itens: psnap.data().itens || {}, ciclo: psnap.data().ciclo || {} };
  } catch(e){ console.warn('Falha ao carregar métricas por post', e); }
  if (copyUnsub) { copyUnsub(); copyUnsub = null; }
  copyUnsub = onSnapshot(copyRef(docId), (snap) => {
    if (!snap.exists()) return;
    copyData = { itens: snap.data().itens || {} };
    if (tabAtivo === 'copy' && document.getElementById('copy-cards')) {
      const ae = document.activeElement;
      if (!ae || !ae.closest || !ae.closest('#copy-cards')) renderCopyCards();
    }
  }, (err)=>console.warn('Copy listener:', err.code));
  if (designUnsub) { designUnsub(); designUnsub = null; }
  designUnsub = onSnapshot(designRef(docId), (snap) => {
    if (!snap.exists()) return;
    designData = { itens: snap.data().itens || {} };
    if (tabAtivo === 'design' && document.getElementById('design-cards')) {
      const ae = document.activeElement;
      if (!ae || !ae.closest || !ae.closest('#design-cards')) renderDesignCards();
    }
  }, (err)=>console.warn('Design listener:', err.code));
  if (postsUnsub) { postsUnsub(); postsUnsub = null; }
  postsUnsub = onSnapshot(postsRef(docId), (snap) => {
    if (!snap.exists()) return;
    postsData = { itens: snap.data().itens || {}, ciclo: snap.data().ciclo || {} };
    if (tabAtivo === 'metricas' && document.getElementById('metricas-body')) {
      const ae = document.activeElement;
      if (!ae || !ae.closest || !ae.closest('#metricas-body')) buildMetricasTab();
    }
  }, (err)=>console.warn('Métricas-post listener:', err.code));
}

// ── Modelo de dados de um item de copy ────────────────────────────────────────
function defaultCopy(id) {
  const it = gradeItems.find(x => x.id === id);
  return {
    isVideo: !!(it && /reels/i.test(it.formato || '')),
    direcionamento:'', materiais:'', slides:[{texto:''}], reels:'',
    legenda:'', blog:'', imagens:[], tabelas:[], statusCopy:'', statusArte:'', statusGabi:'', comentarios:[], notificadoEm:''
  };
}
function normalizeCopy(c) {
  if (!Array.isArray(c.slides) || !c.slides.length) c.slides = [{texto:''}];
  if (!Array.isArray(c.comentarios)) c.comentarios = [];
  if (!Array.isArray(c.imagens)) c.imagens = [];
  if (!Array.isArray(c.tabelas)) c.tabelas = [];
  // O Firestore não aceita array dentro de array: cada linha é {cels:[...]}.
  // Aceita também o formato simples (linha como array) vindo de JSON importado.
  c.tabelas.forEach(t => {
    if (!Array.isArray(t.cols)) t.cols = [];
    if (!Array.isArray(t.rows)) t.rows = [];
    t.rows = t.rows.map(r => Array.isArray(r) ? { cels: r.slice() } : (r && Array.isArray(r.cels) ? r : { cels: [] }));
    // A tabela não tem mais campo de título separado — o texto vira a primeira
    // linha da grade, que é onde ele apareceria de qualquer jeito.
    if (t.titulo) {
      t.rows.unshift({ cels: t.cols.slice() });
      t.cols = t.cols.map((_, i) => i === 0 ? t.titulo : '');
      delete t.titulo;
    }
    // "Coluna A/B" era rótulo automático da versão anterior; numa grade solta
    // vira só ruído dentro da célula.
    t.cols = t.cols.map(v => /^Coluna [A-Z]$/.test(v || '') ? '' : v);
  });
  migrarTabelasParaArte(c);
  return c;
}
// A POSIÇÃO da tabela/imagem é a marca [tabela N] / [imagem N] dentro do texto —
// é ela que faz o editor desenhar o widget no ponto exato e o designer ler o
// slide na ordem certa. `block` é só a lembrança de a qual campo a tabela
// pertencia numa versão anterior, usada para recolocar a marca uma única vez.
function blocosArte(c){ return c.isVideo ? ['reels'] : (c.slides||[]).map((_,i)=>'slide:'+i); }
function migrarTabelasParaArte(c){
  const arte = blocosArte(c);
  const padrao = arte[0] || 'slide:0';
  const todoTexto = () => [c.reels, c.legenda, c.blog].concat((c.slides||[]).map(s=>s.texto)).join('\n');
  (c.tabelas||[]).forEach((t, ti) => {
    if (!t.block) return;            // tabela atual: a posição já é a marca no texto
    const marca = '[tabela ' + (ti+1) + ']';
    if (todoTexto().includes(marca)) { delete t.block; return; }   // já posicionada
    // Sem marca no texto: veio da versão que guardava a posição em `block`.
    // Recoloca a marca no fim daquele campo — que é onde ela era desenhada.
    const alvo = (t.block && arte.includes(t.block)) ? t.block : padrao;
    const atual = String(blockText(c, alvo) || '');
    const novo = (atual ? atual.replace(/\s*$/,'') + '\n' : '') + marca + '\n';
    if (alvo === 'reels') c.reels = novo;
    else if (alvo.startsWith('slide:')) { const i = +alvo.split(':')[1]; if (c.slides[i]) c.slides[i].texto = novo; }
    delete t.block;
  });
  return c;
}
function getCopy(id) {
  return normalizeCopy(copyData.itens[id] ? copyData.itens[id] : defaultCopy(id));
}
function ensureCopy(id) {
  if (!copyData.itens[id]) copyData.itens[id] = defaultCopy(id);
  return normalizeCopy(copyData.itens[id]);
}
function blockText(c, block) {
  if (block === 'reels')   return c.reels || '';
  if (block === 'legenda') return c.legenda || '';
  if (block === 'blog')    return c.blog || '';
  if (block.startsWith('slide:')) { const i = +block.split(':')[1]; return (c.slides[i] && c.slides[i].texto) || ''; }
  return '';
}
function gabiLabel(s) {
  return {
    validacao_necessaria:'Validação necessária',
    em_validacao:'Em validação',
    revisao_necessaria:'Revisão necessária',
    aprovado:'Aprovado',
    cancelado:'Cancelado'
  }[s] || s;
}

// ── Salvamento (doc de copies) ────────────────────────────────────────────────
function agendarSaveCopy() {
  const el = document.getElementById('save-status');
  if (el) { el.textContent = '● Salvando...'; el.classList.add('saving'); }
  clearTimeout(copySaveTimer);
  copySaveTimer = setTimeout(salvarCopy, 1200);
}
async function salvarCopy() {
  if (!copyCiclo || bloqueiaGravacaoLocal()) return;
  // Blindagem: o Firestore rejeita array dentro de array (linhas de tabela).
  Object.values(copyData.itens || {}).forEach(it => { if (it && typeof it === 'object') normalizeCopy(it); });
  try {
    await setDoc(copyRef(copyCiclo), { itens: copyData.itens, updatedAt: new Date().toISOString() });
    const el = document.getElementById('save-status');
    if (el) { el.textContent = '✓ Salvo'; el.classList.remove('saving'); }
    setTimeout(() => { const e2 = document.getElementById('save-status'); if (e2) e2.textContent = ''; }, 2500);
  } catch(e) { showToast('Erro ao salvar copy. Verifique a conexão.'); console.error(e); }
}

// ── Importar copy (JSON) — grava os textos do ciclo de uma vez ─────────────────
window.abrirImportCopy = function() {
  let m = document.getElementById('impc-modal');
  if (!m) {
    m = document.createElement('div');
    m.id = 'impc-modal'; m.className = 'impc-modal';
    m.innerHTML = `<div class="impc-box">
      <h3>Importar copy (JSON)</h3>
      <p>Selecione o arquivo <strong>copy-…json</strong> ou cole o conteúdo. Isso substitui os textos deste ciclo.</p>
      <input type="file" accept="application/json,.json" onchange="impcFile(this)">
      <textarea id="impc-text" placeholder="… ou cole o JSON aqui"></textarea>
      <div class="impc-actions">
        <button onclick="fecharImportCopy()">Cancelar</button>
        <button class="impc-go" onclick="importarCopyJSON()">Importar e salvar</button>
      </div></div>`;
    document.body.appendChild(m);
  }
  document.getElementById('impc-text').value = '';
  m.style.display = 'flex';
}
window.fecharImportCopy = function() { const m = document.getElementById('impc-modal'); if (m) m.style.display = 'none'; }
window.impcFile = function(inp) {
  const f = inp.files && inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { document.getElementById('impc-text').value = r.result; };
  r.readAsText(f);
}
window.importarCopyJSON = async function() {
  if (!copyCiclo) { showToast('Abra um ciclo primeiro.'); return; }
  let data;
  try { data = JSON.parse(document.getElementById('impc-text').value); }
  catch(e) { showToast('JSON inválido.'); return; }
  const itens = (data && data.itens && typeof data.itens === 'object') ? data.itens
    : ((data && typeof data === 'object' && !Array.isArray(data)) ? data : null);
  if (!itens) { showToast('JSON de copy sem "itens".'); return; }
  const n = Object.keys(itens).length;
  const existentes = Object.keys(copyData.itens || {}).length;
  // Mescla: adiciona os itens novos e atualiza os de mesmo id, mantendo os demais.
  // Assim dá para subir um conteúdo por vez (a skill de redação escreve um a um).
  const msg = existentes
    ? `Adicionar/atualizar ${n} conteúdo(s) de copy neste ciclo, mantendo os ${existentes} já existentes? (itens com o mesmo id são substituídos)`
    : `Importar ${n} conteúdo(s) de copy para este ciclo?`;
  if (!confirm(msg)) return;
  Object.values(itens).forEach(it => { if (it && typeof it === 'object') normalizeCopy(it); });
  copyData = { itens: { ...(copyData.itens || {}), ...itens } };
  await salvarCopy();
  renderCopyCards();
  fecharImportCopy();
  showToast('✓ Copy importado: ' + n + ' conteúdo(s)');
}

};

// ── Formatação do copy (Unicode + emoji) ──────────────────────────────────────
// Negrito/itálico viram caracteres Unicode que sobrevivem ao colar no Instagram/
// LinkedIn (legendas são texto puro). Mantém tudo como texto → não quebra os
// comentários por posição da Gabi.
const _cA=0x41,_cZ=0x5A,_ca=0x61,_cz=0x7A,_c0=0x30,_c9=0x39;
function _toBold(ch){ const c=ch.codePointAt(0);
  if(c>=_cA&&c<=_cZ) return String.fromCodePoint(0x1D5D4+(c-_cA));
  if(c>=_ca&&c<=_cz) return String.fromCodePoint(0x1D5EE+(c-_ca));
  if(c>=_c0&&c<=_c9) return String.fromCodePoint(0x1D7EC+(c-_c0));
  return ch; }
function _toItal(ch){ const c=ch.codePointAt(0);
  if(c>=_cA&&c<=_cZ) return String.fromCodePoint(0x1D608+(c-_cA));
  if(c>=_ca&&c<=_cz) return String.fromCodePoint(0x1D622+(c-_ca));
  return ch; }
function _unstyle(ch){ const c=ch.codePointAt(0);
  if(c>=0x1D5D4&&c<=0x1D5ED) return String.fromCharCode(_cA+(c-0x1D5D4));
  if(c>=0x1D5EE&&c<=0x1D607) return String.fromCharCode(_ca+(c-0x1D5EE));
  if(c>=0x1D7EC&&c<=0x1D7F5) return String.fromCharCode(_c0+(c-0x1D7EC));
  if(c>=0x1D608&&c<=0x1D621) return String.fromCharCode(_cA+(c-0x1D608));
  if(c>=0x1D622&&c<=0x1D63B) return String.fromCharCode(_ca+(c-0x1D622));
  return ch; }
function _isBold(ch){ const c=ch.codePointAt(0); return (c>=0x1D5D4&&c<=0x1D607)||(c>=0x1D7EC&&c<=0x1D7F5); }
function _isItal(ch){ const c=ch.codePointAt(0); return (c>=0x1D608&&c<=0x1D63B); }
// Acentuadas (ç, ã, é…) não têm versão negrito/itálico no Unicode. Solução: decompõe
// (NFD) → estiliza a letra-base → recoloca o acento por cima. Assim "ação" fica todo
// em negrito, não só o "a" e o "o". Pontuação não tem variante e passa igual.
function _ehAcento(ch){ const c=ch.codePointAt(0); return c>=0x0300&&c<=0x036F; }
function _styleStr(str,kind){
  let out='';
  for(const ch of str.normalize('NFD')){
    if(_ehAcento(ch)){ out+=ch; continue; }
    out += (kind==='bold') ? _toBold(ch) : _toItal(ch);
  }
  return out;
}
function _unstyleStr(str){
  let out='';
  for(const ch of str){ out += _ehAcento(ch) ? ch : _unstyle(ch); }
  return out.normalize('NFC');   // recompõe "a"+til → "ã"
}
// Alvo da barra de formatação: o editor rico em que o cursor está — seja ele da
// aba Copy ou de uma ata. `escopo` restringe a barra ao seu próprio tipo, para a
// barra da ata não escrever num campo de copy que ficou focado antes.
function copyFmtTarget(escopo){
  const a=document.activeElement;
  const ed=a && a.closest ? a.closest('.rt-editor') : null;
  if(!ed || !ed.isContentEditable) return null;
  if(escopo && (ed.dataset.rt||'copy') !== escopo) return null;
  return ed;
}
// Escreve no editor pelo execCommand para não perder o cursor nem o desfazer.
function rtEscrever(el, txt){
  document.execCommand('insertText', false, txt);
  el.dispatchEvent(new Event('input',{bubbles:true}));
}
function rtTextoSelecionado(el){
  const sel=window.getSelection();
  if(!sel || !sel.rangeCount) return '';
  const r=sel.getRangeAt(0);
  if(!el.contains(r.startContainer) || r.collapsed) return '';
  return sel.toString();
}
window.fmtCopy=function(ev,kind,escopo){
  ev.preventDefault();
  const el=copyFmtTarget(escopo); if(!el){ showToast('Clique no campo de texto primeiro.'); return; }
  if(kind==='bullet'){ rtEscrever(el, '\n• '); return; }
  if(kind==='link'){
    const url=(prompt('Cole o link (entra como texto — em legenda de rede social o link não fica clicável):')||'').trim();
    if(!url) return;
    const sel=rtTextoSelecionado(el);
    rtEscrever(el, sel ? (sel+' '+url) : url);
    return;
  }
  const trecho=rtTextoSelecionado(el);

// EDITOR RICO — o texto é um documento só
// ══════════════════════════════════════════════════════════════════════════════
// O designer precisa ler o slide de cima a baixo: título, subtítulo, a tabela na
// posição em que ela entra, o texto de apoio, o CTA. Então tabela e imagem são
// desenhadas DENTRO da caixa de texto, no ponto exato.
//
// O que é guardado continua sendo uma string pura, com [tabela N] / [imagem N]
// marcando a posição. É isso que mantém de pé (a) os comentários da Gabi, que são
// posições de caractere, e (b) o colar da legenda no Instagram. A marca nunca
// aparece para quem escreve: no lugar dela vai o widget de verdade.
//
// O editor nasceu na aba Copy, mas ata de reunião pede exatamente a mesma coisa.
// Em vez de um segundo editor, o que muda é só a FONTE do documento: quem sabe
// achar o objeto (texto + tabelas + imagens), gravar e redesenhar. O escopo viaja
// no DOM (data-rt), então cada handler descobre sozinho com quem está falando.
const RT_ESCOPOS = {
  copy: {
    doc:        (id) => ensureCopy(id),
    texto:      (id, block) => blockText(getCopy(id), block),
    gravar:     (id, block, txt) => rtGravarTexto(id, block, txt),
    salvar:     () => agendarSaveCopy(),
    redesenhar: (id) => renderOneCard(id),
    raiz:       (id) => document.getElementById('copy-card-' + id),
    editavel:   () => copyMode === 'edit' && ROLE === 'editor',
    // Tabela e imagem são instrução de diagramação da arte: em legenda e blog
    // não existe imagem no meio do texto em rede social nenhuma.
    aceitaWidget: (block) => /^(slide:|reels$)/.test(block || ''),
    ondeWidget: 'no texto da arte (slide ou roteiro do reels)',
  },
  ata: {
    doc:        (id) => ensureAtaDoc(id),
    texto:      (id) => ensureAtaDoc(id).texto || '',
    gravar:     (id, block, txt) => { ensureAtaDoc(id).texto = txt; },
    salvar:     () => agendarSalvamento(),
    redesenhar: (id) => renderAtaDoc(id),
    raiz:       (id) => document.getElementById('ata-doc-' + id),
    editavel:   () => atasPodeEditar(),
    aceitaWidget: () => true,          // na ata o texto é um só: vale em qualquer ponto
    ondeWidget: 'nas anotações da ata',
  },
};
const rtEsc = (nome) => RT_ESCOPOS[nome] || RT_ESCOPOS.copy;
// Um widget (tabela/imagem) é atômico: contenteditable=false, o cursor pula por cima.
function rtWidgetTabela(id, ti, t, editavel, escopo){
  const corpo = editavel ? tabelaEditorHTML(id, t, ti, escopo) : tabelaRenderHTML(t);
  return `<div class="rt-w rt-w-tab" contenteditable="false" data-marca="tabela" data-n="${ti+1}">${corpo}</div>`;
}
function rtWidgetImagem(id, ii, im, editavel){
  const del = editavel ? `<button class="rt-w-x" title="Tirar do texto" onmousedown="rtRemoverWidget(event,${id},'imagem',${ii+1})">✕</button>` : '';
  const cap = im.legenda ? `<span class="rt-img-cap">${esc(im.legenda)}</span>` : '';
  return `<div class="rt-w rt-w-img" contenteditable="false" data-marca="imagem" data-n="${ii+1}">${del}<img src="${esc(im.url)}" alt="${esc(im.legenda||('imagem '+(ii+1)))}">${cap}</div>`;

// texto (com marcas) → HTML do editor
function rtHTML(id, c, texto, escopo){
  escopo = escopo || 'copy';
  const editavel = rtEsc(escopo).editavel();
  let out = '';
  const re = /\[(tabela|imagem) (\d+)\]/g;
  let last = 0, m;
  const txt = String(texto || '');
  while ((m = re.exec(txt)) !== null) {
    out += esc(txt.slice(last, m.index));
    const n = +m[2] - 1;
    if (m[1] === 'tabela' && (c.tabelas||[])[n])      out += rtWidgetTabela(id, n, c.tabelas[n], editavel, escopo);
    else if (m[1] === 'imagem' && (c.imagens||[])[n]) out += rtWidgetImagem(id, n, c.imagens[n], editavel);
    else out += esc(m[0]);                       // marca sem dono: mostra crua para dar para apagar
    last = m.index + m[0].length;
  }
  out += esc(txt.slice(last));
  return out;
}
// HTML do editor → texto (com marcas).
// O contenteditable monta a quebra de linha do jeito dele: às vezes <br>, às
// vezes <div>. Os dois viram "\n" aqui, e o widget vira a marca de volta.
function rtSerializar(el){
  let out = '';
  const anda = (node) => {
    node.childNodes.forEach(n => {
      if (n.nodeType === 3) { out += n.textContent; return; }
      if (n.nodeType !== 1) return;
      if (n.dataset && n.dataset.marca) { out += `[${n.dataset.marca} ${n.dataset.n}]`; return; }
      if (n.tagName === 'BR') {
        // <div><br></div> é como o navegador escreve "linha vazia": o \n do
        // bloco já dá conta, senão contaria a quebra duas vezes.
        const enche = n.parentNode !== el && n.parentNode.childNodes.length === 1;
        if (!enche) out += '\n';
        return;
      }
      if (/^(DIV|P|LI|H[1-6]|SECTION|ARTICLE|BLOCKQUOTE|PRE)$/.test(n.tagName)) {
        if (out !== '') out += '\n';   // todo bloco começa numa linha nova
        anda(n);
        return;
      }
      anda(n);   // SPAN, B, I... só o texto interessa
    });
  };
  anda(el);
  return out.replace(/\u00a0/g, ' ');   // &nbsp; do contenteditable → espaço normal
}
function rtEditorHTML(id, c, block, texto, placeholder, escopo){
  escopo = escopo || 'copy';

// Guarda a posição do cursor como offset no TEXTO (não no DOM) para reinserir
// depois de redesenhar o editor.
function rtOffsetCursor(el){
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  if(!el.contains(r.startContainer)) return null;
  const pre = r.cloneRange();
  pre.selectNodeContents(el);
  pre.setEnd(r.startContainer, r.startOffset);
  const frag = pre.cloneContents();
  const tmp = document.createElement('div');
  tmp.appendChild(frag);
  return rtSerializar(tmp).length;
}
// Só roda logo depois de rtRedesenhar, quando a árvore está plana (nós de texto
// + widgets), então basta percorrer os filhos diretos — e assim o texto de
// dentro do widget não entra na conta.
function rtPorCursor(el, offset){
  el.focus();
  const sel = window.getSelection(); const r = document.createRange();
  const põe = (fn) => { fn(r); r.collapse(true); sel.removeAllRanges(); sel.addRange(r); };
  if(offset != null){
    let acc = 0;
    for(const n of el.childNodes){
      if(n.nodeType === 3){
        const len = n.textContent.length;
        if(acc + len >= offset){ põe(rr => rr.setStart(n, Math.max(0, offset-acc))); return; }
        acc += len;
      } else if(n.nodeType === 1 && n.dataset && n.dataset.marca){
        const len = (`[${n.dataset.marca} ${n.dataset.n}]`).length;
        if(acc + len >= offset){ põe(rr => rr.setStartAfter(n)); return; }
        acc += len;
      }
    }
  }
  r.selectNodeContents(el); r.collapse(false); sel.removeAllRanges(); sel.addRange(r);
}
// Redesenha o editor mantendo o cursor (usado ao inserir/remover widget).
function rtRedesenhar(id, block, offset, escopo){
  escopo = escopo || 'copy';

  const el = rtEditorDoBloco(id, block, escopo); if(!el) return;
  el.innerHTML = rtHTML(id, f.doc(id), f.texto(id, block), escopo);
  autoGrowScope(el);          // as células da tabela crescem conforme o texto
  rtPorCursor(el, offset);
}

  // Ctrl/Cmd+B e Ctrl/Cmd+I usam o negrito Unicode, não o do navegador (que
  // viraria <b> e não sobreviveria ao colar no Instagram).
  if((ev.ctrlKey || ev.metaKey) && !ev.altKey){

// Insere a marca na posição do cursor do editor (ou no fim, se não houver cursor).
function rtInserirMarca(id, block, marca, escopo){
  escopo = escopo || 'copy';
  const f = rtEsc(escopo);
  const el = rtEditorDoBloco(id, block, escopo); if(!el) return;
  const sel = window.getSelection();
  const dentro = sel && sel.rangeCount && el.contains(sel.getRangeAt(0).startContainer);
  if(!dentro){ el.focus(); const r=document.createRange(); r.selectNodeContents(el); r.collapse(false); sel.removeAllRanges(); sel.addRange(r); }
  const txt = f.texto(id, block);
  const off = rtOffsetCursor(el) ?? txt.length;
  // A marca fica sempre na sua própria linha, sem criar linha em branco à toa.
  const pre = (off>0 && txt[off-1] !== '\n') ? '\n' : '';
  const pos = (txt[off] !== '\n' ) ? '\n' : '';
  f.gravar(id, block, txt.slice(0,off) + pre + marca + pos + txt.slice(off));
  f.salvar();
  rtRedesenhar(id, block, off + pre.length + marca.length + pos.length, escopo);
}
function rtGravarTexto(id, block, txt){
  const c = ensureCopy(id);

  else if(block === 'legenda') c.legenda = txt;
  else if(block === 'blog') c.blog = txt;

// Tira o widget do texto (a tabela/imagem em si continua existindo no conteúdo).
window.rtRemoverWidget = function(ev, id, tipo, n){
  ev.preventDefault(); ev.stopPropagation();
  const w = ev.target.closest('.rt-w'); const el = w && w.closest('.rt-editor'); if(!el) return;
  const escopo = el.dataset.rt || 'copy', f = rtEsc(escopo);
  const block = el.dataset.copyblock;
  const txt = f.texto(id, block);
  const marca = `[${tipo} ${n}]`;
  const at = txt.indexOf(marca);
  if(at < 0) return;
  f.gravar(id, block, (txt.slice(0, at) + txt.slice(at + marca.length)).replace(/\n{3,}/g,'\n\n'));
  f.salvar();
  rtRedesenhar(id, block, at, escopo);
};

// Selo de decisão somente leitura (visualizador / equipe de design)

// Na validação, [imagem N] vira a imagem e a tabela em texto vira tabela de verdade.
// O texto-fonte fica num span escondido de propósito: offsetInBlock percorre os nós
// de texto para posicionar os comentários da Gabi, então ele não pode sumir.
function inlineImagens(html, c){
  const imgs=c.imagens||[];
  return html.replace(/\[imagem (\d+)\]/g, (m, n) => {
    const im=imgs[+n-1]; if(!im) return m;
    return `<span class="vsrc">${m}</span><span class="vimg vrender"><img src="${esc(im.url)}" alt="${esc(im.legenda||m)}">${im.legenda?`<span class="vimg-cap">${esc(im.legenda)}</span>`:''}</span>`;
  });
}
function inlineTabelas(html){
  return html.replace(/(?:\|[^\n]*\|\n?)+/g, (m) => {
    const linhas=m.split('\n').filter(l=>l.trim());
    if(linhas.length<2) return m;
    const rows=linhas.map(l=>l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim()));
    const corpo=rows.filter(r=>!r.every(x=>/^-*$/.test(x)));
    if(corpo.length<1) return m;
    const [head,...resto]=corpo;
    const th='<tr>'+head.map(x=>`<th>${x}</th>`).join('')+'</tr>';
    const tb=resto.map(r=>'<tr>'+r.map(x=>`<td>${x}</td>`).join('')+'</tr>').join('');
    return `<span class="vsrc">${m}</span><table class="vtab vrender">${th}${tb}</table>`;
  });
}
// [tabela N] → a tabela de verdade, exatamente na posição marcada.
// O texto-fonte fica num span escondido de propósito: offsetInBlock percorre os
// nós de texto para posicionar os comentários da Gabi, então ele não pode sumir.
function inlineTabelasRef(html, c){
  const tabs=c.tabelas||[];
  return html.replace(/\[tabela (\d+)\]/g, (m, n) => {
    const t=tabs[+n-1]; if(!t) return m;
    return `<span class="vsrc">${m}</span><span class="vrender vtab-wrap">${tabelaRenderHTML(t)}</span>`;
  });
}
function vblockHTML(id, c, block, label, text) {
  const comments = (c.comentarios||[]).filter(x => x.block === block && !x.resolvido);
  let corpo = renderComentado(text||'', comments);
  corpo = inlineImagens(corpo, c);      // imagem na posição em que foi inserida
  corpo = inlineTabelasRef(corpo, c);   // tabela na posição em que foi inserida
  corpo = inlineTabelas(corpo);         // compatibilidade: tabela escrita em texto com |
  // Só quem valida (Gabi/Vitor) seleciona para comentar — a equipe de design só lê.
  const podeCmt = ehCliente();
  return `<div class="cf">
    ${label?`<label class="cf-lbl">${label}${podeCmt?'<span class="cf-cmt-dica">selecione o trecho para pedir alteração</span>':''}</label>`:''}
    <div class="vblock${podeCmt?' vb-cmt':''}" data-item="${id}" data-block="${block}"${podeCmt?' title="Selecione o trecho que quer alterar e escreva o ajuste"':''}>${corpo}</div>
    ${commentListHTML(id, c, block)}
  </div>`;
}
function cardValidacao(it, c) {
  const blocks = [];
  if (c.isVideo) {
    blocks.push(vblockHTML(it.id, c, 'reels', 'Texto da arte — Reels', c.reels));
  } else {
    const dicaSlide = ehCliente() ? '<span class="cf-cmt-dica">selecione o trecho para pedir alteração</span>' : '';
    c.slides.forEach((s, i) => blocks.push(`<div class="vslide-num">Slide ${i+1}${dicaSlide}</div>` + vblockHTML(it.id, c, 'slide:'+i, null, s.texto)));
  }
  blocks.push(vblockHTML(it.id, c, 'legenda', 'Texto da legenda', c.legenda));
  if (c.blog) blocks.push(vblockHTML(it.id, c, 'blog', 'Texto de blog', c.blog));
  const decisao = podeValidarCopy() ? gabiDecisionRow(it, c) : decisionBadgeRO(c);
  return `${statusSummaryRO(c)}${decisao}
    ${c.direcionamento?`<div class="cf"><label class="cf-lbl">Direcionamento</label><div style="font-size:12px;color:var(--z-text-sec)">${esc(c.direcionamento)}</div></div>`:''}
    ${blocks.join('')}
    ${copyImagensHTML(it.id, c)}
`;
}

// ── Comentários (lista + marcação por palavra) ────────────────────────────────
function commentListHTML(id, c, block) {
  const cs = (c.comentarios||[]).filter(x => x.block === block && !x.resolvido);
  if (!cs.length) return '';
  return `<div class="cmt-list">${cs.map(cm => `
    <div class="cmt-item" id="cmt-${cm.id}">
      <div class="cmt-quote">“${esc(cm.quote)}”</div>
      <div class="cmt-texto">${esc(cm.texto)}</div>
      <div class="cmt-foot"><span class="cmt-meta">— ${esc(cm.autor||'Gabi')}</span>
        ${ehVisualizador() ? '' : `<button class="cmt-resolve" onclick="resolverComentario(${id},'${cm.id}')">✓ Resolver</button>`}</div>
    </div>`).join('')}</div>`;
}
function renderComentado(text, comments) {
  if (!text) return '<span class="vblock-empty">— sem texto —</span>';
  const cs = comments.filter(c => c.start < c.end).slice().sort((a,b) => a.start - b.start);
  let html = '', pos = 0;
  for (const c of cs) {
    const s = Math.max(pos, Math.min(c.start, text.length));
    const e = Math.max(s, Math.min(c.end, text.length));
    if (s > pos) html += esc(text.slice(pos, s));
    html += `<mark class="cmt" data-cid="${c.id}" onclick="focarComentario('${c.id}')">${esc(text.slice(s, e))}</mark>`;
    pos = e;
  }
  if (pos < text.length) html += esc(text.slice(pos));
  return html;
}
// Imagem e tabela renderizadas duplicariam texto na contagem (legenda, células),
// deslocando os comentários. Só o texto-fonte conta — o renderizado é ignorado.
function ehRenderizado(node) {
  const el = node.nodeType === 1 ? node : node.parentElement;
  return !!(el && el.closest && el.closest('.vrender'));
}
function offsetInBlock(block, node, nodeOffset) {
  let offset = 0;
  const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT, {
    acceptNode(n){ return ehRenderizado(n) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT; }
  });
  let n;
  while ((n = walker.nextNode())) {
    if (n === node) return offset + nodeOffset;
    offset += n.textContent.length;
  }
  return offset;
}

// As caixas de texto do copy acompanham o tamanho do texto (sem caixinha pequena
// com texto longo). Elemento escondido tem scrollHeight 0 — por isso também roda
// ao abrir o card (ver toggleCopyCard).
window.autoGrow = function(el){
  if(!el || el.tagName!=='TEXTAREA' || !el.offsetParent) return;
  el.style.height='auto';
  el.style.height=(el.scrollHeight+2)+'px';
};
// Ajusta a altura de todo textarea abaixo de `root`.
// Três passadas de propósito: a imediata resolve o caso comum; a do próximo
// quadro pega o layout que ainda não tinha sido calculado; e a do timer é a
// rede de segurança para quando a aba está em segundo plano — aí o
// requestAnimationFrame simplesmente não roda, e era isso que deixava as
// células da tabela na altura mínima, escondendo o texto.
function autoGrowScope(root){
  if(!root) return;
  const passa = () => root.querySelectorAll('textarea').forEach(el => autoGrow(el));
  passa();
  requestAnimationFrame(passa);
  setTimeout(passa, 60);
}
// Mudou a largura da tela (girar o celular, teclado abrindo, barra do navegador
// sumindo), o texto da célula re-quebra e precisa de outra altura. Sem isto, a
// altura fica com o valor antigo e o texto some.
let _agResize = null;
function reajustarAlturas(){
  clearTimeout(_agResize);
  _agResize = setTimeout(() => {
    // Todo lugar que tem tabela: os cards de copy e as atas de reunião.
    ['copy-cards','atas-wrap'].forEach(id => {
      const el = document.getElementById(id);
      if (el) autoGrowScope(el);
    });
  }, 150);
}
window.addEventListener('resize', reajustarAlturas);
window.addEventListener('orientationchange', reajustarAlturas);
// Voltar para a aba também: se o navegador segurou o layout enquanto ela estava
// escondida, as alturas são refeitas na volta.
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') reajustarAlturas(); });
window.updateCopyField = function(id, field, el) { const c = ensureCopy(id); c[field] = el.value; autoGrow(el); agendarSaveCopy(); };
window.updateSlide = function(id, i, el) { const c = ensureCopy(id); c.slides[i].texto = el.value; autoGrow(el); agendarSaveCopy(); };
window.addSlide = function(id) { const c = ensureCopy(id); c.slides.push({texto:''}); agendarSaveCopy(); renderSlides(id); };
window.removeSlide = function(id, i) {
  const c = ensureCopy(id);
  c.slides.splice(i, 1);
  if (!c.slides.length) c.slides.push({texto:''});
  // As tabelas apontam para 'slide:N': a do slide removido volta para o anterior
  // e as de baixo sobem uma casa, senão ficariam órfãs ou no slide errado.
  const ultimo = c.slides.length - 1;
  (c.tabelas||[]).forEach(t => {
    const m = /^slide:(\d+)$/.exec(t.block||'');
    if (!m) return;
    const n = +m[1];
    t.block = 'slide:' + (n === i ? Math.min(i, ultimo) : (n > i ? n - 1 : n));
  });
  agendarSaveCopy(); renderOneCard(id);
};

const podeSubirImgCopy = () => ROLE === 'editor';
window.onCopyImgFiles = async function(id, input){
  const files=[...input.files]; input.value='';
  if(!files.length) return;
  if(!CLOUDINARY_CLOUD || !CLOUDINARY_PRESET){ showToast('Upload ainda não configurado (Cloudinary).'); return; }
  const c=ensureCopy(id); const prog=document.getElementById('ci-prog-'+id); let ok=0; let erro='';
  for(const f of files){
    const barra=barrarPorTamanho(f);
    if(barra){ erro=barra; continue; }
    try{
      const r=await uploadCloudinary(f, (pct)=>{ if(prog) prog.textContent=`Enviando ${f.name} — ${pct}%`; });
      c.imagens.push({ url:r.url, publicId:r.publicId, legenda:'' }); ok++;
    }
    catch(e){ console.error(e); erro=`Não deu para enviar “${f.name}”: ${e.message}`; }
  }
  if(prog) prog.textContent='';
  if(erro) showToast(erro);
  agendarSaveCopy(); renderOneCard(id);
  if(ok) showToast(`✓ ${ok} imagem(ns) adicionada(s)`);
};

  removerMarcaERenumerar(c,'imagem',i);
  agendarSaveCopy(); renderOneCard(id);
};

// Último editor de texto do copy em que se clicou — é nele que a imagem da
// galeria entra quando se usa "↳ Inserir no texto".
let ultimoCampoCopy = null;
document.addEventListener('focusin', (e) => {

  if (ed && ed.isContentEditable && ed.closest('#copy-cards')) ultimoCampoCopy = ed;

function nomeDoCampo(el){

  const sc=el.closest('.slide-card'); if(sc) return (sc.querySelector('.slide-num')?.textContent||'slide');
  const lbl=el.closest('.cf')?.querySelector('.cf-lbl')?.textContent;

window.inserirImgNoTexto = function(id,i){
  const card=document.getElementById('copy-card-'+id);
  let ed = (ultimoCampoCopy && card && card.contains(ultimoCampoCopy) && document.body.contains(ultimoCampoCopy))
    ? ultimoCampoCopy : null;
  if(ed && !blocoEhArte(ed.dataset.copyblock)) ed = null;
  if(!ed && card) ed = card.querySelector('.rt-editor[data-copyblock^="slide:"], .rt-editor[data-copyblock="reels"]');
  if(!ed){ showToast('Clique antes no texto da arte onde a imagem deve entrar.'); return; }
  rtInserirMarca(id, ed.dataset.copyblock, `[imagem ${i+1}]`);
  showToast(`Imagem ${i+1} entrou em: ${nomeDoCampo(ed)}`);

function copyImagensHTML(id, c){
  const todas=c.imagens||[];
  const pode = podeSubirImgCopy() && copyMode==='edit';
  // Na validação a imagem já aparece dentro do texto — a galeria aqui embaixo só
  // mostra as que ficaram sem posição, para não duplicar tudo.
  const usadas=new Set();
  if(!pode) COPY_BLOCOS(c).forEach(b=>{ const re=/\[imagem (\d+)\]/g; let m; const t=blockText(c,b); while((m=re.exec(t))!==null) usadas.add(+m[1]-1); });
  // guarda o índice original — é ele que numera "imagem N" e casa com a marca
  const imgs = todas.map((im,i)=>({im,i})).filter(x => pode || !usadas.has(x.i));
  if(!imgs.length && !pode) return '';
  const thumbs=imgs.map(({im,i})=>`
    <div class="ci-item">
      <div class="ci-thumb"><img src="${esc(im.url)}" alt="imagem ${i+1}">${pode?`<button class="dz-del" onclick="removeCopyImg(${id},${i})" title="Remover">✕</button>`:''}<span class="ci-num">imagem ${i+1}</span></div>
      ${pode
        ? `<input type="text" class="ci-leg" value="${esc(im.legenda||'')}" placeholder="Legenda (opcional)" oninput="updateCopyImgLegenda(${id},${i},this)">
           <button class="ci-ins" onclick="inserirImgNoTexto(${id},${i})">↳ Inserir no texto</button>`
        : (im.legenda?`<div class="ci-leg-ro">${esc(im.legenda)}</div>`:'')}
    </div>`).join('');
  const up = pode
    ? `<label class="dz-btn">🖼 Adicionar imagem<input type="file" accept="image/*" multiple style="display:none" onchange="onCopyImgFiles(${id},this)"></label><span class="dz-progress" id="ci-prog-${id}"></span>`
    : '';
  const dica = pode ? `<div class="dz-ordhint">Suba aqui e depois use o botão <strong>🖼</strong> da barra de formatação para colocá-la no ponto do texto da arte. Limite de ${mbs(UPLOAD_MAX)} por arquivo.</div>` : '';
  const lbl = pode ? '🖼 Imagens do conteúdo' : '🖼 Imagens sem posição no texto';
  return `<div class="cf"><label class="cf-lbl">${lbl}</label>
    <div class="ci-grid">${thumbs}</div>${up}${dica}</div>`;
}

// ── Tabelas do copy (tabela de verdade, guardada como dados) ───────────────────
// A tabela mora DENTRO do campo em que foi criada: o texto guarda a marca
// [tabela N] e o editor da tabela é desenhado logo abaixo daquele campo, na
// ordem em que as marcas aparecem. O texto continua sendo uma string pura —
// é isso que faz os comentários por posição da Gabi e o colar no Instagram
// continuarem funcionando.
// Sem `block`: a posição da tabela é a marca [tabela N] que rtInserirMarca põe no
// texto. `block` só existe em dado antigo, e migrarTabelasParaArte o converte.
function tabelaVazia(){ return { titulo:'', cols:['Coluna A','Coluna B'], rows:[{cels:['','']},{cels:['','']}] }; }
function ensureTab(id, ti, escopo){ const d=rtEsc(escopo||'copy').doc(id); return (d.tabelas||[])[ti]; }
function celsDa(r){ return (r && Array.isArray(r.cels)) ? r.cels : (Array.isArray(r) ? r : []); }
const COPY_BLOCOS = (c) => ['reels','legenda','blog'].concat((c.slides||[]).map((_,i)=>'slide:'+i));
// Reescreve as marcas de todos os campos de texto (usado ao remover imagem/tabela).
// A ata tem um campo só; o copy tem legenda, blog, reels e os slides.
function reescreverMarcas(c, tipo, fn){
  const re=new RegExp('\\[' + tipo + ' (\\d+)\\]','g');
  const sub=(s)=>{
    const antes=String(s||'');
    if(!re.test(antes)){ re.lastIndex=0; return antes; }   // nada a fazer: não mexe no texto
    re.lastIndex=0;
    return antes.replace(re,(m,n)=>fn(+n,m)).replace(/\n{3,}/g,'\n\n');
  };
  if('texto' in c && !('slides' in c)){ c.texto=sub(c.texto); return; }   // ata
  c.reels=sub(c.reels); c.legenda=sub(c.legenda); c.blog=sub(c.blog);
  (c.slides||[]).forEach(s=>{ s.texto=sub(s.texto); });
}
// Ao apagar o item idx (0-based): tira a marca dele e puxa as de cima uma casa.
// Sem isso as marcas passariam a apontar para a tabela/imagem errada.
function removerMarcaERenumerar(c, tipo, idx){
  reescreverMarcas(c, tipo, (n,m) => (n-1===idx) ? '' : (n-1>idx ? `[${tipo} ${n-1}]` : m));
}
window.removeTabela = function(id, ti, escopo){
  escopo = escopo || 'copy';
  const f=rtEsc(escopo), d=f.doc(id);
  if(!confirm('Remover esta tabela? Ela sai do texto e as outras são renumeradas.')) return;
  (d.tabelas||[]).splice(ti,1);
  removerMarcaERenumerar(d,'tabela',ti);
  f.salvar(); f.redesenhar(id);
};
// A tabela é uma GRADE simples, igual à do Google Docs: todas as células iguais,
// sem cabeçalho especial, sem título, sem numeração. A primeira linha é `cols`
// (só por causa do formato antigo) — na tela ela é uma linha como as outras.
function tabGrade(t){ return [t.cols].concat((t.rows||[]).map(celsDa)); }
function tabCelula(t, r, c, val){
  const linha = (r===0) ? t.cols : celsDa(t.rows[r-1]);
  if(!linha) return;
  if(val===undefined) return linha[c] || '';
  linha[c] = val;
}
window.updateTabCelula = function(id,ti,r,c,el,escopo){
  const t=ensureTab(id,ti,escopo); if(!t) return;
  tabCelula(t,r,c,el.value);
  autoGrow(el);
  rtEsc(escopo||'copy').salvar();
};
const _tabRefaz = (id,escopo)=>{ const f=rtEsc(escopo||'copy'); f.salvar(); f.redesenhar(id); };
window.addTabLinha = function(id,ti,escopo){ const t=ensureTab(id,ti,escopo); if(t){ t.rows.push({cels:t.cols.map(()=>'')}); _tabRefaz(id,escopo); } };
window.addTabCol = function(id,ti,escopo){ const t=ensureTab(id,ti,escopo); if(t){ t.cols.push(''); t.rows.forEach(r=>celsDa(r).push('')); _tabRefaz(id,escopo); } };
window.removeTabLinha = function(id,ti,r,escopo){
  const t=ensureTab(id,ti,escopo); if(!t) return;
  if(tabGrade(t).length<=1){ showToast('A tabela precisa de pelo menos uma linha.'); return; }
  if(r===0){ t.cols = celsDa(t.rows[0]).slice(); t.rows.shift(); }   // 1ª linha some: a de baixo vira ela
  else t.rows.splice(r-1,1);
  _tabRefaz(id,escopo);
};
window.removeTabCol = function(id,ti,ci,escopo){
  const t=ensureTab(id,ti,escopo); if(!t) return;
  if(t.cols.length<=1){ showToast('A tabela precisa de pelo menos uma coluna.'); return; }
  t.cols.splice(ci,1); t.rows.forEach(r=>celsDa(r).splice(ci,1));
  _tabRefaz(id,escopo);
};
function tabelaEditorHTML(id, t, ti, escopo){
  const e = escopo ? `,'${escopo}'` : '';
  const g = tabGrade(t);
  const nc = t.cols.length;
  // alças de coluna: aparecem no hover, para remover a coluna
  const alcas = t.cols.map((_,ci)=>`<td class="tb-alca"><button class="tb-x" title="Remover coluna" onclick="removeTabCol(${id},${ti},${ci}${e})">✕</button></td>`).join('');
  const linhas = g.map((linha, r) => `<tr>${
    t.cols.map((_,c)=>`<td><textarea rows="1" data-r="${r}" data-c="${c}"
        oninput="updateTabCelula(${id},${ti},${r},${c},this${e})"
        onfocus="autoGrow(this)"
        onkeydown="tbKey(event,${id},${ti}${e})"
        onpaste="tbPaste(event,${id},${ti},${r},${c}${e})">${esc(linha[c]||'')}</textarea></td>`).join('')
    }<td class="tb-alca"><button class="tb-x" title="Remover linha" onclick="removeTabLinha(${id},${ti},${r}${e})">✕</button></td></tr>`).join('');
  // Cada coluna precisa de ~160px para o texto respirar. Com muitas colunas a
  // tabela passa da largura do card e rola de lado, em vez de espremer tudo.
  const minW = Math.max(280, nc * 160);
  return `<div class="tb-card" data-ti="${ti}" data-ncols="${nc}">
    <table class="tb-edit" style="min-width:${minW}px">${linhas}<tr class="tb-alcas">${alcas}<td></td></tr></table>
    <div class="tb-acts">
      <button class="tb-btn" onclick="addTabLinha(${id},${ti}${e})">+ linha</button>
      <button class="tb-btn" onclick="addTabCol(${id},${ti}${e})">+ coluna</button>
      <button class="tb-btn tb-del-btn" onclick="removeTabela(${id},${ti}${e})">✕ tabela</button>
    </div>
  </div>`;
}
// Tab anda entre as células (e no fim cria linha). O Enter fica valendo dentro
// da célula: no Docs a célula tem várias linhas, e é assim que se monta o slide.
window.tbKey = function(ev, id, ti, escopo){
  if(ev.key!=='Tab') return;
  const inp=ev.target, card=inp.closest('.tb-card'); if(!card) return;
  const cels=[...card.querySelectorAll('.tb-edit textarea')];
  const pos=cels.indexOf(inp);
  ev.preventDefault();
  const alvo = ev.shiftKey ? cels[pos-1] : cels[pos+1];
  if(alvo){ alvo.focus(); alvo.select(); return; }
  if(!ev.shiftKey){
    addTabLinha(id,ti,escopo);
    setTimeout(()=>{
      const raiz=rtEsc(escopo||'copy').raiz(id);
      const n=raiz && raiz.querySelector(`.tb-card[data-ti="${ti}"] .tb-edit tr:nth-last-child(2) textarea`);
      if(n) n.focus();
    },30);
  }
};
// Colar do Sheets/Excel: TSV com várias linhas preenche a tabela a partir da célula.
window.tbPaste = function(ev, id, ti, ri, ci, escopo){
  const txt=(ev.clipboardData||window.clipboardData).getData('text')||'';
  if(!/[\t\n]/.test(txt)) return;               // texto simples: comportamento normal
  ev.preventDefault();
  const linhas=txt.replace(/\r/g,'').replace(/\n+$/,'').split('\n').map(l=>l.split('\t'));
  const t=ensureTab(id,ti,escopo); if(!t) return;
  const nCols=Math.max(t.cols.length, ci + Math.max(...linhas.map(l=>l.length)));
  while(t.cols.length<nCols) t.cols.push('');
  t.rows.forEach(r=>{ const cel=celsDa(r); while(cel.length<nCols) cel.push(''); });
  linhas.forEach((linha,li)=>{
    const alvoR=ri+li;                            // r é 0-based na grade (0 = 1ª linha)
    while(tabGrade(t).length<=alvoR) t.rows.push({cels:t.cols.map(()=>'')});
    linha.forEach((v,k)=>{ if(ci+k<nCols) tabCelula(t, alvoR, ci+k, v); });
  });
  _tabRefaz(id,escopo);
  showToast(`Tabela preenchida com ${linhas.length} linha(s) coladas.`);
};
// A mesma grade renderizada (validação e leitura). Sem cabeçalho especial: as
// células são todas iguais, como numa tabela de Google Docs.
function tabelaRenderHTML(t){
  const linhas=tabGrade(t).map(linha =>
    '<tr>'+t.cols.map((_,ci)=>`<td>${esc(linha[ci]||'')}</td>`).join('')+'</tr>').join('');
  return `<table class="vtab">${linhas}</table>`;
}

// Seleção de texto → popover de comentário (apenas modo validação).
// Vale para mouse e para toque: no celular a Gabi segura a palavra e solta.
function onSelecaoValidacao(e) {
  if (!ehCliente()) return;
  if (e.target.closest && e.target.closest('#cmt-pop')) return;
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) return;
  const block = e.target.closest && e.target.closest('.vblock');
  if (!block) return;
  const range = sel.getRangeAt(0);
  if (!block.contains(range.startContainer) || !block.contains(range.endContainer)) return;
  // Dentro da tabela/imagem renderizada não dá para mapear a posição no texto-fonte.
  if (ehRenderizado(range.startContainer) || ehRenderizado(range.endContainer)) {
    showToast('Para comentar a tabela ou a imagem, selecione o texto ao redor dela.');
    return;
  }
  const s = offsetInBlock(block, range.startContainer, range.startOffset);
  const en = offsetInBlock(block, range.endContainer, range.endOffset);
  const a = Math.min(s, en), b = Math.max(s, en);
  if (b <= a) return;
  // No toque não existe pageX/pageY do evento: usa o retângulo da seleção.
  let px = e.pageX, py = e.pageY;
  if (px == null || py == null) {
    const r = range.getBoundingClientRect();
    px = r.left + window.scrollX; py = r.bottom + window.scrollY;
  }
  showCmtPopover(+block.dataset.item, block.dataset.block, a, b, px, py);
}
document.addEventListener('mouseup', onSelecaoValidacao);
// touchend dispara logo ao soltar, antes de o navegador fechar a seleção; o
// pequeno atraso deixa a seleção do celular se firmar antes de ler.
document.addEventListener('touchend', (e) => { setTimeout(() => onSelecaoValidacao(e), 120); });
document.addEventListener('mousedown', (e) => {
  const p = document.getElementById('cmt-pop');
  if (p && p.style.display === 'block' && !e.target.closest('#cmt-pop') && !e.target.closest('.vblock')) hideCmtPopover();
});

// ABA DESIGN — upload (Cloudinary) + preview IG/LinkedIn + validação + notificação

function defaultDesign(){ return { midias:[], statusDesign:'', comentarioDesign:'', enviadoEm:'', enviadoPor:'', notificadoEm:'' }; }
// Mídias ordenadas: [{type:'image'|'video', url, publicId, w?, h?}]. Lê o formato
// antigo ({imagens:[], video:{}}) sem mutar — imagens na ordem + vídeo ao final.
function desMidias(d){
  if(!d) return [];
  if(Array.isArray(d.midias)) return d.midias;
  const m=[];
  (Array.isArray(d.imagens)?d.imagens:[]).forEach(im=>m.push({ type:'image', url:im.url, publicId:im.publicId, w:im.w, h:im.h }));
  if(d.video) m.push({ type:'video', url:d.video.url, publicId:d.video.publicId });
  return m;
}
// Reels (9:16) só quando é UM único vídeo, sem imagens. Carrossel com um slide de
// vídeo continua sendo carrossel (4:5).
function desIsReels(d){ const m=desMidias(d); return m.length===1 && m[0].type==='video'; }
// A proporção do preview segue o TIPO do conteúdo: Story e Reels são verticais
// (9:16, sem bordas nas laterais); os demais (Carrossel, Post estático) são 4:5.
function itFormato(id){ const it=(gradeItems||[]).find(x=>String(x.id)===String(id)); return it?(it.formato||''):''; }
function desVertical(id,d){ const f=itFormato(id); return f==='Story'||f==='Reels'||desIsReels(d); }
function slideInner(md,idx){
  return md&&md.type==='video'
    ? `<video src="${esc(md.url)}" controls playsinline></video>`
    : `<img src="${esc(md?md.url:'')}" alt="slide ${(idx||0)+1}">`;
}
function normalizeDesign(d){ if(!Array.isArray(d.midias)){ d.midias=desMidias(d); delete d.imagens; delete d.video; } return d; }
function getDesign(id){ return normalizeDesign(designData.itens[id] ? designData.itens[id] : defaultDesign()); }
function ensureDesign(id){ if(!designData.itens[id]) designData.itens[id]=defaultDesign(); return normalizeDesign(designData.itens[id]); }
function designLabel(s){ return { aprovado:'Aprovado', ajustes_necessarios:'Ajustes necessários', em_analise:'Em análise' }[s] || s; }

function agendarSaveDesign(){
  const el=document.getElementById('save-status'); if(el){ el.textContent='● Salvando...'; el.classList.add('saving'); }
  clearTimeout(designSaveTimer); designSaveTimer=setTimeout(salvarDesign,1000);
}
async function salvarDesign(){
  if(!copyCiclo || bloqueiaGravacaoLocal()) return;
  try{
    await setDoc(designRef(copyCiclo), { itens: designData.itens, updatedAt:new Date().toISOString() });

}

// Upload sem backend — Cloudinary unsigned
// Teto da conta Cloudinary (plano gratuito): 100 MB por arquivo. Acima disso a
// API responde 400 "File size too large" — dá para avisar antes de gastar o
// upload inteiro à toa.
const UPLOAD_MAX = 100 * 1024 * 1024;
function mbs(bytes){ return (bytes/1048576).toLocaleString('pt-BR',{maximumFractionDigits:1}) + ' MB'; }
// XHR (e não fetch) porque só ele dá progresso de upload — vídeo de 80 MB leva
// minutos e sem barra parece que travou.
function uploadCloudinary(file, onProgresso){
  return new Promise((resolve, reject) => {
    const fd=new FormData(); fd.append('file',file); fd.append('upload_preset',CLOUDINARY_PRESET);
    const xhr=new XMLHttpRequest();
    xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/auto/upload`);
    if(onProgresso && xhr.upload){
      xhr.upload.onprogress = (e) => { if(e.lengthComputable) onProgresso(Math.round(e.loaded/e.total*100)); };
    }
    xhr.onload = () => {
      let d=null; try{ d=JSON.parse(xhr.responseText); }catch(e){}
      if(xhr.status>=200 && xhr.status<300 && d){
        resolve({ url:d.secure_url, publicId:d.public_id, w:d.width, h:d.height, resource_type:d.resource_type });
      } else {
        // devolve a mensagem real do Cloudinary, não um "falha" genérico
        reject(new Error((d && d.error && d.error.message) ? d.error.message : ('HTTP '+xhr.status)));
      }
    };
    xhr.onerror = () => reject(new Error('Sem conexão com o servidor de mídia.'));
    xhr.send(fd);
  });
}
// Checa o tamanho ANTES de enviar. Devolve a mensagem de erro, ou null se pode ir.
function barrarPorTamanho(f){
  if(f.size <= UPLOAD_MAX) return null;
  const ehVideo = /^video\//.test(f.type);
  return `“${f.name}” tem ${mbs(f.size)} e o limite por arquivo é ${mbs(UPLOAD_MAX)}.` +
    (ehVideo ? ' Reexporte o vídeo com bitrate menor (H.264, ~8–10 Mbps) — um Reels de 1 min costuma ficar entre 15 e 30 MB.' : ' Reduza a resolução ou salve como JPG.');
}

// Envio de um email. Em condicoes normais usa o SDK; quando a aba esta fechando
// o SDK nao termina a tempo, entao vai por sendBeacon (a REST do EmailJS aceita
// o mesmo payload com o public key como user_id).
function enviarEmailJS(params, usarBeacon){
  if(!EMAILJS_SERVICE || !EMAILJS_TEMPLATE || !EMAILJS_PUBLIC) return Promise.resolve();
  // Mesma trava da gravação: rodando em localhost (teste) não dispara email de
  // verdade para ninguém — só registra no console o que teria sido enviado.
  if(ehLocal()){
    // Em teste o email não sai; mostra o que teria saído, inteiro, para dar
    // para conferir a diagramação e a lista sem mandar nada para ninguém.
    console.warn('🔧 Modo local — email NÃO enviado:', params.destino, '|', params.titulo, '\n' + params.lista);
    (window.__emailsLocais = window.__emailsLocais || []).push(params);
    return Promise.resolve();
  }
  if(usarBeacon){
    // fetch com keepalive, e não sendBeacon: o corpo precisa ir como
    // application/json, o que exige preflight de CORS — e o sendBeacon não sabe
    // fazer preflight, então a requisição morreria calada.
    const corpo = JSON.stringify({ service_id:EMAILJS_SERVICE, template_id:EMAILJS_TEMPLATE,
                                   user_id:EMAILJS_PUBLIC, template_params:params });
    return fetch('https://api.emailjs.com/api/v1.0/email/send', {
      method:'POST', keepalive:true, headers:{ 'Content-Type':'application/json' }, body:corpo
    }).catch(e=>console.warn('Aviso de produção não saiu:', e));
  }
  if(window.emailjs) return window.emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, params, { publicKey:EMAILJS_PUBLIC });
  return Promise.resolve();
}

// Envia UM email consolidado com a lista (não mais um por item). Reusado por
// Conteúdos, Copy e Planejamento. area = rótulo; lista = array de strings.
async function notificarNovidades(area, lista, cicloPeriodo, opts){
  opts = opts || {};
  const destinos = opts.destinos || NOTIFY_EMAILS;
  const ciclo = cicloPeriodo || (estado.planejamentos||[]).find(p=>cicloDocId(p)===copyCiclo)?.periodo || copyCiclo || '';
  const quem=USER_EMAIL||ROLE||'equipe';
  const link=location.href.split('?')[0];
  const n=lista.length;
  const ehPlan = area==='Planejamento';
  // Mensagem clara e concisa, com campos SEPARADOS (assunto curto, resumo, lista) —
  // o template do EmailJS diagrama cada um. Nada de despejar a lista no assunto.
  const resumo = ehPlan
    ? 'O planejamento deste ciclo está pronto para a sua validação.'
    : `${n} ${area==='Copy'?'texto(s)':'conteúdo(s)'} ${n===1?'aguarda':'aguardam'} a sua validação.`;
  const listaTxt = ehPlan ? 'A grade do ciclo está montada — abra para revisar e validar.' : lista.map(s=>'• '+s).join('\n');
  const titulo = opts.titulo || (ehPlan ? 'Planejamento pronto para validar' : `Novidades em ${area}`);
  const txtResumo = opts.resumo || resumo;
  const assunto = `🔔 ${area} · ${ciclo}`;
  const base = { assunto, area, titulo, ciclo, resumo:txtResumo, lista:listaTxt, quem, link, item:txtResumo };
  try{
    for(const to of destinos){ await enviarEmailJS({ ...base, destino:to }, opts.beacon); }
  }catch(e){ console.warn('Falha ao notificar por email', e); }
  const msg=`${assunto}%0A${resumo}%0A${ehPlan?'':lista.map(s=>'• '+s).join('%0A')}%0A${link}`;
  for(const a of WHATSAPP_ALVOS){
    try{ if(a.phone && a.apikey){ await fetch(`https://api.callmebot.com/whatsapp.php?phone=${encodeURIComponent(a.phone)}&text=${msg}&apikey=${encodeURIComponent(a.apikey)}`, { mode:'no-cors' }); } }catch(e){}
  }
}
// ── TEXTO APROVADO → AVISA A PRODUÇÃO ────────────────────────────────────────
// Quando a Gabi aprova um texto, ele está liberado para a Bonina produzir. Isso
// não pode depender de ela lembrar de apertar um botão — mas também não pode
// virar um email por texto. Solução: junta as aprovações e manda UM aviso
// quando ela para de mexer (90s), ou na hora em que fecha a aba (sendBeacon).
const AVISO_ESPERA_MS = 90000;
let aprovadosNaFila = [];
let timerAvisoProducao = null;
function agendarAvisoProducao(){
  clearTimeout(timerAvisoProducao);
  timerAvisoProducao = setTimeout(()=>enviarAvisoProducao(false), AVISO_ESPERA_MS);
}
function enviarAvisoProducao(fechando){
  clearTimeout(timerAvisoProducao);
  if(!aprovadosNaFila.length) return;
  const lista = aprovadosNaFila.slice(); aprovadosNaFila = [];
  const n = lista.length;
  // Só a equipe de design. O Vitor não entra aqui: quando quem aprovou foi a
  // Gabi, a mesma aprovação já vai no email de atividade dela; quando foi ele
  // mesmo, receber a própria ação de volta é só ruído.
  notificarNovidades('Copy aprovado', lista, null, {
    destinos: VISUALIZADOR_EMAILS,
    titulo: 'Texto liberado para produção',
    resumo: `A Gabi aprovou ${n} texto${n>1?'s':''} — já dá para começar a arte.`,
    beacon: !!fechando,
  });
  if(!fechando) showToast(`🔔 A equipe de design foi avisada (${n} texto${n>1?'s':''} aprovado${n>1?'s':''}).`);
}
// A aba fechando ainda tem uma última chance de despachar o aviso.
window.addEventListener('pagehide', ()=>enviarAvisoProducao(true));
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') enviarAvisoProducao(true); });
function textoAprovadoParaProducao(id){
  const it=(gradeItems||[]).find(x=>x.id===id); if(!it) return;
  const c=ensureCopy(id);
  if(c.avisadoProducao) return;                    // já contou uma vez
  c.avisadoProducao=new Date().toISOString();
  aprovadosNaFila.push(`${it.data||''} — ${it.titulo||'(sem título)'}`);
  agendarAvisoProducao();
  agendarSaveCopy();
}

// ── A GABI MEXEU EM ALGUMA COISA → AVISA ─────────────────────────────────────
// O Vitor coordena o processo e quer saber de tudo que ela toca (copy,
// planejamento e artes); a Bonina só precisa saber das artes. O risco óbvio é
// virar enxurrada: ela abre a validação, mexe em dez conteúdos e dispara dez
// emails. Por isso a fila é POR CONTEÚDO, não por clique — cada conteúdo entra
// uma vez só, acumulando o que ela fez nele, e sai UM email quando ela para de
// mexer (90s) ou fecha a aba.
let ativFila = new Map();          // chave "area#id" → { area, rotulo, oque:Set }
let timerAtividade = null;
const ATIV_AREAS = { copy:'Copy', design:'Artes', plan:'Planejamento' };
function rotuloDoItem(area, id, docId){
  const it=(gradeItems||[]).find(x=>x.id===id);
  if(it) return `${it.data||''} — ${it.titulo||'(sem título)'}`;
  // Vindo do planejador (iframe) a grade pode não ser a mesma que está na tela.
  return docId ? `${docId} · conteúdo ${id}` : `conteúdo ${id}`;
}
// area: 'copy' | 'design' | 'plan'. `oque` é a frase curta do que ela fez.
function registrarAtividadeGabi(area, id, oque, docId){
  if(!ehCliente()) return;                       // só a Gabi alimenta esta fila
  const chave = area + '#' + id + '#' + (docId||copyCiclo||'');
  let reg = ativFila.get(chave);
  if(!reg){ reg = { area, rotulo: rotuloDoItem(area, id, docId), oque: new Set() }; ativFila.set(chave, reg); }
  reg.oque.add(oque);
  clearTimeout(timerAtividade);
  timerAtividade = setTimeout(()=>despacharAtividadeGabi(false), AVISO_ESPERA_MS);
}
function despacharAtividadeGabi(fechando){
  clearTimeout(timerAtividade);
  if(!ativFila.size) return;
  const regs = [...ativFila.values()]; ativFila.clear();
  const linha = (r) => `${ATIV_AREAS[r.area]||r.area} · ${r.rotulo} — ${[...r.oque].join('; ')}`;
  const todas = regs.map(linha);
  const artes = regs.filter(r=>r.area==='design').map(linha);
  const n = todas.length;
  // Vitor: tudo. Sempre um email só, com uma linha por conteúdo.
  notificarNovidades('Atividade da Gabi', todas, null, {
    destinos: EDITOR_EMAILS,
    titulo: 'A Gabi mexeu no HUB',
    resumo: `${n} novidade${n>1?'s':''} da Gabi — uma linha por conteúdo.`,
    beacon: !!fechando,
  });
  // Bonina: só o que é arte, e só se houver.
  if(artes.length){
    notificarNovidades('Artes', artes, null, {
      destinos: VISUALIZADOR_EMAILS,
      titulo: 'A Gabi avaliou artes',
      resumo: `${artes.length} arte${artes.length>1?'s':''} com retorno da Gabi.`,
      beacon: !!fechando,
    });
  }
  if(!fechando) showToast(`🔔 Aviso enviado (${n} conteúdo${n>1?'s':''}).`);
}
window.addEventListener('pagehide', ()=>despacharAtividadeGabi(true));
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') despacharAtividadeGabi(true); });
// O planejamento roda num iframe (../planejador/). Ele avisa o HUB do que a Gabi
// fez lá dentro e o aviso entra na MESMA fila — senão seriam dois canais soltos.
window.addEventListener('message', (ev)=>{
  if(ev.origin !== location.origin) return;                    // só o nosso iframe
  const m = ev.data;
  if(!m || m.tipo !== 'zelo:atividade-gabi') return;
  registrarAtividadeGabi('plan', m.id, String(m.oque||'mexeu no planejamento').slice(0,80), m.docId);
});

// Conteúdos: envia de uma vez todas as artes novas (com mídia, não aprovadas e
// ainda não avisadas). Uma notificação só, não uma por arte.
window.enviarDesignCiclo=function(){
  const novos=[];
  (gradeItems||[]).forEach(it=>{
    const d=ensureDesign(it.id);
    if(desMidias(d).length && d.statusDesign!=='aprovado' && !d.notificadoEm){
      if(!d.enviadoEm) d.enviadoEm=new Date().toISOString();
      d.enviadoPor=USER_EMAIL||ROLE;
      if(!d.statusDesign) d.statusDesign='em_analise';
      d.notificadoEm=new Date().toISOString();
      novos.push(`${it.data||''} — ${it.titulo||'(sem título)'}`);
    }
  });
  if(!novos.length){ showToast('Nenhuma novidade — tudo já foi enviado ou aprovado.'); return; }
  agendarSaveDesign(); renderDesignCards();
  notificarNovidades('Conteúdos', novos, null, { destinos: AVISAR_GABI });
  showToast(`🔔 ${novos.length} conteúdo(s) enviado(s). A Gabi foi avisada uma vez.`);
};

// helpers
function snapsSorted(){ return (metricasData.snapshots||[]).slice().sort((a,b)=>(a.mesRef||'').localeCompare(b.mesRef||'')); }
// Ano de um snapshot vem do mesRef ("2026-07" → 2026). Métricas mensais são
// agrupadas pelo ano ativo (seletor no topo da aba), como Planejamento/Copy/Conteúdos.
function anoDoMes(ref){ const y=parseInt(String(ref||'').slice(0,4),10); return isNaN(y)?null:y; }
function snapsAno(){ return snapsSorted().filter(s=>anoDoMes(s.mesRef)===anoAtivo); }
function mesLabel(ref){ if(!ref) return ''; const [y,m]=ref.split('-'); return (MESES_ABR[(+m)-1]||'')+'/'+(y||'').slice(2); }
function shortNum(v){ v=Number(v)||0; if(Math.abs(v)>=1000) return (v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k'; return String(v); }
function fmtMetric(v, fmt){
  if(fmt==='text') return (v==null||v==='')?'—':v;
  if(v==null||v===''||isNaN(v)) return '—';
  if(fmt==='pct') return Number(v).toLocaleString('pt-BR',{maximumFractionDigits:2})+'%';
  if(fmt==='dec') return Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
  return Number(v).toLocaleString('pt-BR');
}
function deltaHTML(cur, prev, fmt){
  if(fmt==='text'||prev==null||prev===''||cur==null||cur==='') return '';
  const c=Number(cur), p=Number(prev); if(isNaN(c)||isNaN(p)||p===0) return '';
  const pct=(c-p)/p*100; const up=c>=p;
  return `<span class="mx-delta ${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(pct).toLocaleString('pt-BR',{maximumFractionDigits:1})}%</span>`;
}
function metricaChartKey(plat){ return metricaChart[plat] || METRICAS_CONFIG[plat].campos[0].k; }

function valorMetrica(snap, plat, field){
  const po=(snap&&snap[plat])?snap[plat]:{};

    if(field.k==='engajamento'){ const base=Number(po[field.base]); const inter=Number(po.interacoes); return (base>0&&!isNaN(inter))?(inter/base*100):''; }
    return '';

}

function chartSVG(plat){

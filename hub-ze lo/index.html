<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hub — Zelo Consultoria</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#F2F2F2;min-height:100vh;padding:1.5rem}
:root{
  --z-teal:#11808C;--z-teal-light:#E3F1F2;
  --z-terra:#D9814E;--z-terra-light:#FBEEE4;
  --z-ocre:#F2DC9B;--z-ocre-dark:#9A7A1F;--z-ocre-light:#FBF6E8;
  --z-cyan:#05C7F2;
  --z-text:#1A1A1A;--z-text-sec:#5A5A5A;
  --z-border:#DDDDDD;--z-bg:#F2F2F2;
  --t1:#D9814E;--t1-l:#FBEEE4;
  --t2:#11808C;--t2-l:#E3F1F2;
  --t3:#5A5A5A;--t3-l:#F0F0F0;
  --tm:#9A7A1F;--tm-l:#FBF6E8;
}
.container{max-width:1060px;margin:0 auto}

/* ════ SHELL (sidebar + main) ════ */
.shell{display:flex;gap:1.5rem;align-items:flex-start}
.sidebar{width:232px;flex-shrink:0;position:sticky;top:1.5rem;background:#fff;border:0.5px solid var(--z-border);border-radius:16px;padding:1.1rem;box-shadow:0 1px 4px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:1rem}
.main{flex:1;min-width:0}
/* brand */
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:7px}
.brand-logo{width:118px;height:auto;display:block}
.brand-sub{font-size:9.5px;color:var(--z-text-sec);text-transform:uppercase;letter-spacing:.09em;font-weight:700}
/* nav */
.side-nav{display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:10px;border:none;background:transparent;color:var(--z-text-sec);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;text-align:left;transition:background .15s,color .15s,box-shadow .15s,transform .1s;width:100%}
.nav-item:hover{background:var(--z-teal-light);color:var(--z-teal)}
.nav-item:active{transform:scale(.98)}
.nav-item.active{background:var(--z-teal);color:#fff;box-shadow:0 3px 10px rgba(17,128,140,.28)}
.nav-ico{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.side-foot{margin-top:auto;padding-top:.85rem;border-top:0.5px solid var(--z-border)}
.side-foot .copy-row{margin-bottom:10px}
.side-user{display:flex;align-items:center;justify-content:space-between;gap:8px}
.side-email{font-size:10.5px;color:var(--z-text-sec);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.side-sair{flex-shrink:0;background:none;border:none;color:var(--z-terra);font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;padding:2px 4px}
.side-sair:hover{text-decoration:underline}
/* main head */
.main-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:1.4rem;padding-bottom:.95rem;border-bottom:1.5px solid var(--z-border)}
.main-title{font-size:23px;font-weight:800;color:var(--z-text);letter-spacing:-.015em;line-height:1.1}
.main-sub{font-size:12px;color:var(--z-text-sec);margin-top:4px}
.main-head .hh-save,.focus-brand .hh-save{color:#9AA0A6}
.main-head .hh-save.saving,.focus-brand .hh-save.saving{color:var(--z-terra)}
/* focused (validação Gabi) */
.focused{max-width:680px;margin:0 auto}
.focus-brand{display:flex;align-items:center;gap:12px;margin-bottom:1.2rem}
.focus-brand .brand-logo{width:96px}
.focus-brand .hh-save{margin-left:auto;min-height:14px;font-size:11px;transition:color .2s}
/* micro-interações */
.tab-content{animation:fadeUp .26s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.copy-card,.plan-card,.sec-card{transition:box-shadow .18s ease,transform .18s ease,border-color .18s ease}
.copy-card:hover,.sec-card:hover{box-shadow:0 5px 18px rgba(0,0,0,.07);transform:translateY(-2px)}
.plan-card:hover{box-shadow:0 5px 18px rgba(17,128,140,.12);transform:translateY(-2px)}
@media(max-width:860px){
  .container{max-width:680px}
  /* align-items:stretch é essencial: em coluna, o flex-start do desktop fazia a
     área principal encolher até o tamanho do conteúdo e os quadros ficavam com
     metade da largura da tela. */
  .shell{flex-direction:column;gap:1rem;align-items:stretch}
  .main{width:100%}
  .sidebar{width:100%;position:static;flex-direction:column}
  .side-nav{flex-direction:row;gap:6px}
  .nav-item{flex:1;justify-content:center;padding:9px 6px}
  .nav-item .nav-ico{display:none}
  .side-foot{margin-top:0}
}

}

/* AUTH / LOGIN */
.auth-screen{min-height:78vh;display:flex;align-items:center;justify-content:center;padding:2rem}
/* largura pensada para o subtítulo padrão caber em UMA linha só */
.auth-card{background:#fff;border:0.5px solid var(--z-border);border-radius:18px;padding:2.4rem 2.2rem;box-shadow:0 6px 28px rgba(0,0,0,.07);text-align:center;max-width:420px;width:100%}
.auth-logo{width:132px;margin:0 auto 1.3rem;display:block}
.auth-title{font-size:18px;font-weight:800;color:var(--z-text);margin-bottom:6px}
.auth-sub{font-size:13px;color:var(--z-text-sec);line-height:1.55;margin-bottom:1.5rem}
.auth-btn-wrap{max-width:280px;margin:0 auto}
@media(max-width:460px){.auth-sub{font-size:12px}}
.auth-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:11px 16px;border-radius:10px;border:none;background:var(--z-teal);color:#fff;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .15s}
.auth-btn:hover{background:#0A6870}
.g-badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--z-teal);font-weight:800;font-size:13px}
.auth-link{margin-top:14px;background:none;border:none;color:var(--z-text-sec);font-size:12px;font-family:inherit;cursor:pointer;text-decoration:underline}
.auth-link:hover{color:var(--z-teal)}

/* HEADER */
.hub-header{background:linear-gradient(135deg,var(--z-teal) 0%,#0A5961 100%);border-radius:14px;padding:1.5rem;margin-bottom:1.5rem;position:relative;overflow:hidden}
.hub-header::before{content:'';position:absolute;top:-20px;right:-20px;width:100px;height:100px;border-radius:50%;background:var(--z-cyan);opacity:0.2}
.hub-header::after{content:'';position:absolute;bottom:-30px;right:50px;width:70px;height:70px;border-radius:50%;background:var(--z-terra);opacity:0.2}
.hh-lbl{font-size:10px;color:var(--z-ocre);letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:4px;position:relative}
.hh-title{font-size:22px;font-weight:700;color:#fff;position:relative;margin-bottom:2px}
.hh-sub{font-size:12px;color:rgba(255,255,255,.65);position:relative}
.hh-save{font-size:11px;color:rgba(255,255,255,.45);position:relative;margin-top:6px;min-height:14px;transition:color .2s}
.hh-save.saving{color:var(--z-ocre)}

/* TABS */
.tab-bar{display:grid;grid-template-columns:1fr 1fr 1fr;border-radius:10px;overflow:hidden;border:1.5px solid var(--z-teal);margin-bottom:10px}
.tab-btn{padding:11px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;border:none;background:#fff;color:var(--z-teal);transition:all .15s;text-align:center}
.tab-btn.active{background:var(--z-teal);color:#fff}
.tab-btn:not(.active):hover{background:var(--z-teal-light)}
.copy-row{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;border:1px solid var(--z-border);background:#fff;color:var(--z-text-sec);margin-bottom:1.5rem;transition:all .15s}
.copy-row:hover{border-color:var(--z-teal);color:var(--z-teal);background:var(--z-teal-light)}
.copy-row.copied{border-color:#1B6B3A;color:#1B6B3A}

/* SUB-MODO (Base de Dados) */
.sub-bar{display:flex;gap:6px;margin-bottom:1.25rem}
.sub-btn{flex:1;padding:8px 12px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;background:#fff;border:1.5px solid var(--z-border);color:var(--z-text-sec);border-radius:8px;transition:all .15s;text-align:center}
.sub-btn.active{background:var(--z-teal-light);border-color:var(--z-teal);color:var(--z-teal);font-weight:600}

/* TIER LABELS */
.tier-lbl{display:flex;align-items:center;gap:8px;margin:1.5rem 0 .75rem;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.tier-lbl::after{content:'';flex:1;height:1px;background:currentColor;opacity:.25}
.tier-lbl.t1{color:var(--t1)}.tier-lbl.t2{color:var(--t2)}.tier-lbl.t3{color:var(--t3)}.tier-lbl.tm{color:var(--tm)}
.tier-badge{padding:2px 8px;border-radius:20px;color:#fff;font-size:10px;font-weight:700}
.tier-lbl.t1 .tier-badge{background:var(--t1)}.tier-lbl.t2 .tier-badge{background:var(--t2)}
.tier-lbl.t3 .tier-badge{background:var(--t3)}.tier-lbl.tm .tier-badge{background:var(--tm)}

/* SECTION CARDS */
.sec-card{background:#fff;border:0.5px solid var(--z-border);border-radius:12px;padding:1.25rem;margin-bottom:10px;border-left-width:3px;border-left-style:solid}
.sec-card.t1{border-left-color:var(--t1)}.sec-card.t2{border-left-color:var(--t2)}
.sec-card.t3{border-left-color:var(--t3)}.sec-card.tm{border-left-color:var(--tm)}
.sec-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:1.1rem}
.sec-badge{width:26px;height:26px;min-width:26px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sec-card.t1 .sec-badge{background:var(--t1)}.sec-card.t2 .sec-badge{background:var(--t2)}
.sec-card.t3 .sec-badge{background:var(--t3)}.sec-card.tm .sec-badge{background:var(--tm)}
.sec-title{font-size:14px;font-weight:600;color:var(--z-text);line-height:1.2}
.sec-desc{font-size:11px;color:var(--z-text-sec);margin-top:2px;line-height:1.4}

/* FORM FIELDS */
.fld{margin-bottom:12px}
.fl{font-size:11px;font-weight:600;color:var(--z-text-sec);display:block;margin-bottom:4px;letter-spacing:.02em}
.fld input[type=text],.fld textarea{width:100%;font-size:13px;padding:8px 10px;border:0.5px solid var(--z-border);border-radius:8px;background:#fff;color:var(--z-text);font-family:inherit;line-height:1.5}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--z-teal);box-shadow:0 0 0 2px rgba(17,128,140,.08)}
.fld textarea{resize:none}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:500px){.two-col{grid-template-columns:1fr}}

/* PLATFORMS */
.plat-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.plat-btn{font-size:12px;padding:5px 12px;border-radius:20px;border:1.5px solid var(--z-border);background:#fff;color:var(--z-text-sec);cursor:pointer;font-family:inherit;font-weight:500;transition:all .15s}
.plat-btn.on{background:var(--t1-l);border-color:var(--t1);color:var(--t1);font-weight:600}
.plat-url-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.plat-url-label{font-size:12px;font-weight:600;color:var(--z-text-sec);min-width:80px;flex-shrink:0}
.plat-url-inp{flex:1;font-size:12px;padding:6px 10px;border:0.5px solid var(--z-border);border-radius:7px;font-family:inherit;color:var(--z-text)}
.plat-url-inp:focus{outline:none;border-color:var(--t1)}

/* SWOT */
.swot-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.swot-card{border-radius:8px;padding:10px;border-left:3px solid}
.swot-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.swot-card textarea{width:100%;font-size:12px;padding:3px;border:none;background:transparent;resize:none;line-height:1.6;font-family:inherit;color:var(--z-text)}
.swot-card textarea:focus{outline:none}
.swot-f{border-color:#1B6B3A;background:#d7f0e0}.swot-f .swot-lbl{color:#0D4022}
.swot-w{border-color:#9A7A1F;background:#FBF6E8}.swot-w .swot-lbl{color:#5C4810}
.swot-o{border-color:#11808C;background:#E3F1F2}.swot-o .swot-lbl{color:#0A5961}
.swot-a{border-color:#D9814E;background:#FBEEE4}.swot-a .swot-lbl{color:#8A4020}

/* DYNAMIC LISTS */
.dlist-item{background:var(--z-bg);border-radius:8px;padding:10px 12px;margin-bottom:8px;border:0.5px solid var(--z-border)}
.dlist-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dlist-num{font-size:11px;font-weight:600;color:var(--z-teal)}
.dlist-del{font-size:11px;color:var(--z-terra);background:none;border:none;cursor:pointer;font-family:inherit;padding:2px 6px;border-radius:4px}
.dlist-del:hover{background:var(--z-terra-light)}
.dlist-item label{font-size:11px;color:var(--z-text-sec);font-weight:600;display:block;margin-top:6px;margin-bottom:3px}
.dlist-item input[type=text]{width:100%;font-size:12px;padding:6px 8px;border:0.5px solid var(--z-border);border-radius:6px;font-family:inherit;background:#fff;color:var(--z-text)}
.dlist-item input:focus{outline:none;border-color:var(--z-teal)}
.add-btn{width:100%;padding:8px;font-size:12px;border-radius:8px;border:1px dashed var(--z-teal);background:transparent;cursor:pointer;color:var(--z-teal);font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px;transition:background .15s}
.add-btn:hover{background:var(--z-teal-light)}

/* CONTRACT */
.cs-row{display:flex;gap:6px;margin-bottom:12px}
.cs-btn{font-size:12px;padding:6px 16px;border-radius:20px;cursor:pointer;font-family:inherit;font-weight:600;background:#fff;border:1.5px solid var(--z-border);color:var(--z-text-sec);transition:all .15s}
.cs-btn.is-pendente{background:#FBF6E8;border-color:var(--z-ocre-dark);color:var(--z-ocre-dark)}
.cs-btn.is-assinado{background:#d7f0e0;border-color:#1B6B3A;color:#1B6B3A}

/* PLAN CARDS */
/* Seletor de ano (Planejamento / Copy / Conteúdos) */
.ano-bar{display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid var(--z-border);padding-bottom:0}
.ano-tab{position:relative;background:none;border:none;padding:7px 15px 9px;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--z-text-sec);cursor:pointer;border-radius:8px 8px 0 0;transition:color .15s,background .15s}
.ano-tab:hover{color:var(--z-teal);background:var(--z-teal-light)}
.ano-tab.on{color:var(--z-teal)}
.ano-tab.on::after{content:'';position:absolute;left:8px;right:8px;bottom:-1px;height:2.5px;background:var(--z-teal);border-radius:2px}
.ano-tab .ano-n{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:20px;background:var(--z-border);color:var(--z-text-sec)}
.ano-tab.on .ano-n{background:var(--z-teal);color:#fff}
.plan-card{background:var(--z-teal-light);border:0.5px solid rgba(17,128,140,.3);border-radius:10px;padding:14px;margin-bottom:8px}
.plan-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.plan-period{font-size:14px;font-weight:600;color:var(--z-teal)}
.plan-cycle{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--z-teal);color:#fff;font-weight:600}
.plan-cycle-wrap{display:flex;align-items:center;gap:6px}
.ciclo-del{border:none;background:none;cursor:pointer;font-size:13px;padding:2px 4px;border-radius:6px;line-height:1;opacity:.55;transition:opacity .15s,background .15s}
.ciclo-del:hover{opacity:1;background:var(--z-terra-light)}
.plan-links{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.plan-link{display:flex;align-items:center;justify-content:center;gap:4px;padding:8px;border-radius:7px;font-size:12px;font-weight:500;text-decoration:none;font-family:inherit;border:none;cursor:pointer;transition:opacity .15s}
.plan-link:hover{opacity:.85}
.plan-vitor{background:var(--z-teal);color:#fff}
.plan-gabi{background:var(--z-terra-light);color:var(--z-terra);border:1px solid var(--z-terra)}
/* Barra de ciclo aberto (Copy/Design/Planejamento inline) */
.cycle-open-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.back-ciclos{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:7px;border:1px solid var(--z-border);background:#fff;color:var(--z-teal);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s}
.back-ciclos:hover{background:var(--z-teal-light);border-color:var(--z-teal)}
.cycle-open-info{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cycle-open-nome{font-size:14px;font-weight:600;color:var(--z-teal)}
.cycle-open-modo{font-size:11px;padding:2px 9px;border-radius:20px;background:var(--z-ocre-light);color:var(--z-ocre-dark);font-weight:600;white-space:nowrap}
.plan-newtab{margin-left:auto;text-decoration:none;font-size:15px;color:var(--z-text-sec);padding:4px 8px;border-radius:6px}
.plan-newtab:hover{background:var(--z-teal-light);color:var(--z-teal)}
.plan-iframe-wrap{border:1px solid var(--z-border);border-radius:10px;overflow:hidden;background:#fff}
.plan-iframe{display:block;width:100%;height:calc(100vh - 190px);min-height:520px;border:0}
/* ── VISÃO MACRO 2027 ─────────────────────────────────────────────── */
.mac-destaque{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-bottom:14px;border-radius:12px;cursor:pointer;color:#fff;
  background:linear-gradient(120deg,var(--z-teal) 0%,#0c5f68 60%,#0a4f57 100%);box-shadow:0 4px 14px rgba(17,128,140,.25);transition:transform .18s ease,box-shadow .18s ease}
.mac-destaque:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(17,128,140,.32)}
.mac-destaque-ico{font-size:26px;line-height:1}
.mac-destaque-txt{flex:1;min-width:0}
.mac-destaque-t{font-size:15px;font-weight:700}
.mac-destaque-s{font-size:12px;opacity:.9;margin-top:2px}
.mac-destaque-cta{font-size:13px;font-weight:600;white-space:nowrap;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:20px}
.mac-wrap{max-width:840px;margin:0 auto;padding-bottom:20px}
.mac-hero{background:linear-gradient(135deg,var(--z-teal),#0c5f68);color:#fff;border-radius:14px;padding:24px 22px;margin-bottom:20px}
.mac-hero-k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.mac-hero h2{font-size:22px;font-weight:800;margin:6px 0 4px}
.mac-hero-sub{font-size:13px;opacity:.92}
.mac-thread{display:inline-flex;align-items:center;gap:7px;margin-top:14px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:7px 13px;border-radius:22px;font-size:12.5px;font-weight:600}
.mac-sec{margin:26px 0}
.mac-sec-t{font-size:15px;font-weight:700;color:var(--z-teal);margin:0 0 4px;display:flex;align-items:center;gap:8px}
.mac-sec-d{font-size:12.5px;color:var(--z-text-sec);line-height:1.55;margin:0 0 14px}
/* funil */
.mac-funnel{display:flex;flex-direction:column;align-items:center;gap:8px}
.mac-layer{border-radius:10px;padding:13px 16px;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.mac-layer.l-topo{width:100%;background:var(--z-cyan)}
.mac-layer.l-meio{width:84%;background:#7F77DD}
.mac-layer.l-fundo{width:68%;background:var(--z-teal)}
.mac-layer-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mac-layer-h b{font-size:13.5px}
.mac-layer-h span{font-size:11px;opacity:.9}
.mac-layer-f{font-size:12px;opacity:.96;margin-top:3px}
/* ciclos timeline */
.mac-cycles{display:flex;flex-direction:column;gap:10px}
.mac-cyc{border:1px solid var(--z-border);border-left:5px solid var(--cc,#11808C);border-radius:10px;background:#fff;overflow:hidden;transition:box-shadow .18s ease}
.mac-cyc:hover{box-shadow:0 3px 12px rgba(0,0,0,.07)}
.mac-cyc-head{display:flex;align-items:center;gap:13px;padding:13px 15px;cursor:pointer}
.mac-cyc-num{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--cc,#11808C);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.mac-cyc-info{flex:1;min-width:0}
.mac-cyc-per{font-size:11px;color:var(--z-text-sec);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.mac-cyc-tema{font-size:14.5px;font-weight:700;color:var(--z-text)}
.mac-cyc-tag{flex-shrink:0;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--z-teal-light);color:var(--z-teal);white-space:nowrap}
.mac-cyc-chev{flex-shrink:0;color:var(--z-text-sec);transition:transform .2s ease;font-size:13px}
.mac-cyc.open .mac-cyc-chev{transform:rotate(90deg)}
.mac-cyc-body{padding:0 15px 15px 58px;display:none}
.mac-cyc.open .mac-cyc-body{display:block}
.mac-cyc-desc{font-size:12.5px;color:var(--z-text);line-height:1.55;margin-bottom:10px}
.mac-datas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.mac-data{font-size:11px;background:var(--z-ocre-light);color:var(--z-ocre-dark);border:1px solid var(--z-ocre);padding:3px 9px;border-radius:6px;font-weight:600}
.mac-mini-t{font-size:11px;font-weight:700;color:var(--z-text-sec);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 4px}
.mac-gera{font-size:12.5px;color:var(--z-text-sec);line-height:1.5}
.mac-ind{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:var(--z-teal-light);color:var(--z-teal);font-size:12px;font-weight:600;padding:6px 11px;border-radius:8px}
.mac-live{display:inline-block;margin-top:10px;margin-left:6px;font-size:11px;font-weight:700;background:var(--z-terra-light);color:var(--z-terra);border:1px solid var(--z-terra);padding:5px 10px;border-radius:8px}
/* grid de features */
.mac-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.mac-grid{grid-template-columns:1fr}}
.mac-feat{border:1px solid var(--z-border);border-radius:10px;padding:14px 15px;background:#fff}
.mac-feat-t{font-size:13.5px;font-weight:700;color:var(--z-text);display:flex;align-items:center;gap:7px;margin-bottom:5px}
.mac-feat-d{font-size:12px;color:var(--z-text-sec);line-height:1.5}
.mac-band{border-radius:12px;padding:16px 18px;background:var(--z-ocre-light);border:1px solid var(--z-ocre)}
.mac-quote{border-radius:12px;padding:18px 20px;background:var(--z-teal-light);border-left:5px solid var(--z-teal);font-size:13.5px;color:var(--z-text);line-height:1.6}
/* adicionar ciclo (editor) */
.add-ciclo-btn{width:100%;margin-top:4px;padding:11px;border:1.5px dashed var(--z-teal);background:var(--z-teal-light);color:var(--z-teal);border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s}
.add-ciclo-btn:hover{background:#d5eaec}
.add-ciclo-form{margin-top:4px;border:1px solid var(--z-teal);border-radius:10px;padding:14px;background:#fff}
.acf-title{font-size:13px;font-weight:700;color:var(--z-teal);margin-bottom:10px}
.acf-inp{width:100%;box-sizing:border-box;margin-bottom:8px;padding:9px 11px;border:1.5px solid var(--z-border);border-radius:8px;font-family:inherit;font-size:13px;color:var(--z-text)}
.acf-inp:focus{outline:none;border-color:var(--z-teal)}
.acf-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.acf-cancel{padding:8px 14px;border:1px solid var(--z-border);background:#fff;border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;color:var(--z-text-sec);cursor:pointer}
.acf-save{padding:8px 14px;border:none;background:var(--z-terra);color:#fff;border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
/* Barra de salvamento (Base de Dados > Edição) */
.save-bar{position:sticky;top:0;z-index:6;margin-bottom:16px;padding:10px 14px;border-radius:9px;font-size:13px;font-weight:600;border:1px solid;display:flex;align-items:center;gap:8px}
.save-bar-ico{font-size:13px}
.save-bar.saved{background:var(--z-teal-light);color:var(--z-teal);border-color:rgba(17,128,140,.3)}
.save-bar.saving{background:var(--z-ocre-light);color:var(--z-ocre-dark);border-color:var(--z-ocre)}
.save-bar.error{background:var(--z-terra-light);color:var(--z-terra);border-color:var(--z-terra)}
/* ── VISUALIZAÇÃO DASHBOARD (Base de Dados) ─────────────────────────── */
.dv-hero{background:linear-gradient(135deg,var(--z-teal),#0c5f68);color:#fff;border-radius:14px;padding:22px;margin-bottom:16px}
.dv-hero-slogan{font-size:20px;font-weight:800;line-height:1.3}
.dv-hero-pos{font-size:13px;opacity:.92;margin-top:8px;line-height:1.5;white-space:pre-line}
.dv-hero-tom{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.dv-hero-tom .doc-pill{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.25)}
.dv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:640px){.dv-grid{grid-template-columns:1fr}}
.dv-card{background:#fff;border:1px solid var(--z-border);border-radius:12px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.dv-card-full{margin-bottom:12px}
.dv-card-t{font-size:14px;font-weight:700;color:var(--z-teal);margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dv-card-hint{font-size:11px;font-weight:500;color:var(--z-text-sec);background:var(--z-bg);padding:2px 8px;border-radius:20px}
.dv-blk{margin-top:10px}
.dv-blk-l{font-size:10.5px;font-weight:700;color:var(--z-text-sec);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.dv-blk-v{font-size:13px;color:var(--z-text);line-height:1.55;white-space:pre-line}
.dv-pills{display:flex;flex-wrap:wrap;gap:6px}
.dv-swot{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.dv-swot{grid-template-columns:1fr}}
.dv-q{border-radius:10px;padding:12px 14px;cursor:pointer;border:1px solid;transition:box-shadow .2s ease,transform .2s ease}
@media(hover:hover){.dv-q:hover{box-shadow:0 6px 18px rgba(0,0,0,.1);transform:translateY(-2px)}}
.dv-q-head{display:flex;align-items:center;gap:8px}
.dv-q-ico{font-size:16px}
.dv-q-lbl{font-size:13.5px;font-weight:700;flex:1}
.dv-q-count{font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px;background:rgba(255,255,255,.7)}
.dv-q-chev{font-size:10px;opacity:.55;transition:transform .18s ease}
.dv-q.open .dv-q-chev{transform:rotate(180deg)}
.dv-q-items{list-style:none;margin:0;padding:0;display:none}
.dv-q.open .dv-q-items{display:block;margin-top:9px}
@media(hover:hover){.dv-q:hover .dv-q-items{display:block;margin-top:9px}}
.dv-q-items li{font-size:12.5px;line-height:1.45;padding:4px 0 4px 16px;position:relative;border-top:1px solid rgba(0,0,0,.06)}
.dv-q-items li:before{content:'•';position:absolute;left:2px;opacity:.6}
.dv-q-items li:first-child{border-top:0}
.dv-q-empty{opacity:.6;font-style:italic;border-top:0!important}
.dv-q-hint{font-size:10.5px;color:var(--z-text-sec);margin-top:6px;opacity:.7}
.dv-q.open .dv-q-hint{display:none}
@media(hover:hover){.dv-q:hover .dv-q-hint{display:none}}
.dv-q-f{background:var(--z-teal-light);border-color:rgba(17,128,140,.35)}.dv-q-f .dv-q-lbl{color:var(--z-teal)}
.dv-q-w{background:var(--z-terra-light);border-color:rgba(217,129,78,.4)}.dv-q-w .dv-q-lbl{color:var(--z-terra)}
.dv-q-o{background:var(--z-cyan-light,#cdf2fc);border-color:rgba(5,199,242,.4)}.dv-q-o .dv-q-lbl{color:#0a7c99}
.dv-q-a{background:var(--z-ocre-light);border-color:var(--z-ocre)}.dv-q-a .dv-q-lbl{color:var(--z-ocre-dark)}
.dv-mats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.dv-mats{grid-template-columns:1fr}}
.dv-mat{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1px solid var(--z-border);border-radius:10px;background:var(--z-ocre-light);text-decoration:none;color:var(--z-text);transition:box-shadow .18s,transform .18s,border-color .18s}
.dv-mat:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(-2px);border-color:var(--z-ocre-dark)}
.dv-mat-nolink{cursor:default}
.dv-mat-ico{font-size:19px}
.dv-mat-txt{flex:1;min-width:0}
.dv-mat-tit{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv-mat-tipo{font-size:11px;color:var(--z-ocre-dark);font-weight:600}
.dv-mat-arrow{font-size:15px;color:var(--z-teal)}
.dv-empty{font-size:13px;color:var(--z-text-sec);padding:6px 0}
.dv-tag-cli{font-size:9px;font-weight:700;color:#8A5A22;background:#FBF0DC;border:1px solid #E9D6AE;border-radius:20px;padding:2px 7px;margin-left:6px;vertical-align:middle;letter-spacing:.02em;text-transform:none}
.dv-line{font-size:12.5px;color:var(--z-text-sec);line-height:1.6}
.dv-mats-inline{display:flex;flex-wrap:wrap;gap:6px}
.dv-mats-inline .dv-mat{padding:6px 10px}
/* Redes da Zelo: cada ícone é o link para o perfil */
.dv-redes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.dv-rede{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--z-teal);text-decoration:none;background:var(--z-teal-light);border:1px solid rgba(17,128,140,.25);border-radius:20px;padding:5px 11px;transition:background .15s,color .15s}
.dv-rede:hover{background:var(--z-teal);color:#fff;border-color:var(--z-teal)}
.dv-rede-ico{font-size:14px;line-height:1}
.dv-rede-seta{font-size:10px;opacity:.7}
.dv-rede.off{background:var(--z-bg);border-color:var(--z-border);color:var(--z-text-sec);cursor:default}
.dv-lastedit{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--z-text-sec);background:#fff;border:1px solid var(--z-border);border-radius:10px;padding:8px 12px;margin-bottom:14px}
.dv-lastedit.cli{background:#FBF0DC;border-color:#E9D6AE;color:#7A5217}
.dv-le-ico{font-size:13px}
.dv-refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
@media(max-width:640px){.dv-refs{grid-template-columns:1fr}}
.dv-ref{border:1px solid var(--z-border);border-radius:10px;padding:10px 12px;background:#fff}
.dv-ref-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dv-ref-nome{font-size:13px;font-weight:600}
.dv-ref-link{font-size:11px;font-weight:600;color:var(--z-teal);text-decoration:none;white-space:nowrap;background:var(--z-teal-light);border:1px solid var(--z-teal);border-radius:20px;padding:3px 10px;transition:background .15s,color .15s}
.dv-ref-link:hover{background:var(--z-teal);color:#fff}
.dv-ref-desc{font-size:12px;color:var(--z-text-sec);line-height:1.45;margin-top:5px}
/* ── ASSISTENTE DO HUB (chat pop-up) ────────────────────────────────── */
.za-fab{position:fixed;right:20px;bottom:20px;z-index:1200;width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,var(--z-teal),#0c5f68);color:#fff;font-size:24px;box-shadow:0 6px 20px rgba(17,128,140,.35);display:flex;align-items:center;justify-content:center;transition:transform .18s ease,box-shadow .18s ease}
.za-fab:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 10px 26px rgba(17,128,140,.45)}
.za-panel{position:fixed;right:20px;bottom:88px;z-index:1200;width:370px;max-width:calc(100vw - 32px);height:540px;max-height:calc(100vh - 120px);background:#fff;border:1px solid var(--z-border);border-radius:16px;box-shadow:0 14px 44px rgba(0,0,0,.2);display:none;flex-direction:column;overflow:hidden}
.za-panel.open{display:flex;animation:za-in .18s ease}
@keyframes za-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.za-head{background:linear-gradient(135deg,var(--z-teal),#0c5f68);color:#fff;padding:13px 15px;display:flex;align-items:center;gap:10px}
.za-head-ico{font-size:19px}
.za-head-t{font-size:14px;font-weight:700}
.za-head-s{font-size:10.5px;opacity:.85;font-weight:500}
.za-close{background:rgba(255,255,255,.18);border:none;color:#fff;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1}
.za-body{flex:1;overflow-y:auto;padding:14px;background:var(--z-bg);display:flex;flex-direction:column;gap:10px}
.za-msg{max-width:86%;padding:9px 12px;border-radius:13px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.za-msg.bot{background:#fff;border:1px solid var(--z-border);align-self:flex-start;border-bottom-left-radius:3px}
.za-msg.user{background:var(--z-teal);color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.za-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.za-act{padding:6px 11px;border-radius:8px;border:1px solid var(--z-teal);background:var(--z-teal-light);color:var(--z-teal);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;text-align:left}
.za-act.primary{background:var(--z-terra);border-color:var(--z-terra);color:#fff}
.za-act:hover{filter:brightness(.97)}
.za-menu{border-top:1px solid var(--z-border);background:#fff;max-height:230px;overflow-y:auto;padding:10px 12px}
.za-menu-bc{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.za-menu-bc button{background:none;border:none;color:var(--z-teal);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:2px 0}
.za-menu-bc span{font-size:11px;color:var(--z-text-sec);font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.za-menu-grid{display:flex;flex-direction:column;gap:6px}
.za-mbtn{text-align:left;padding:9px 12px;border-radius:9px;border:1px solid var(--z-border);background:var(--z-bg);color:var(--z-text);font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer;transition:border-color .15s,background .15s}
.za-mbtn:hover{border-color:var(--z-teal);background:var(--z-teal-light)}
.za-mbtn.area{font-weight:700;color:var(--z-teal)}
/* ── ATAS DE REUNIÃO ────────────────────────────────────────────────── */
.atas-panel{background:#fff;border:1px solid var(--z-border);border-radius:12px;margin-bottom:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.atas-head{display:flex;align-items:center;gap:9px;padding:13px 16px;cursor:pointer;background:var(--z-ocre-light);border-bottom:1px solid var(--z-ocre)}
.atas-ico{font-size:17px}
.atas-t{font-size:14px;font-weight:700;color:var(--z-ocre-dark);flex:1}
.atas-count{font-size:11px;font-weight:700;background:var(--z-ocre);color:var(--z-ocre-dark);padding:1px 9px;border-radius:20px}
.atas-chev{color:var(--z-ocre-dark);font-size:12px}
.atas-body{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ata-vazio{font-size:13px;color:var(--z-text-sec);padding:6px 2px}
.ata-item{border:1px solid var(--z-border);border-radius:9px;overflow:hidden}
.ata-item.open{border-color:var(--z-ocre)}
.ata-item-head{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.ata-item-head:hover{background:var(--z-bg)}
.ata-data{font-size:11px;font-weight:700;color:var(--z-ocre-dark);white-space:nowrap;background:var(--z-ocre-light);padding:2px 8px;border-radius:6px}
.ata-titulo{font-size:13px;font-weight:600;color:var(--z-text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ata-chev{color:var(--z-text-sec);font-size:12px}
.ata-item-body{padding:6px 12px 12px;border-top:1px dashed var(--z-border)}
.ata-row{margin-top:9px}
.ata-lbl{display:block;font-size:11px;font-weight:700;color:var(--z-text-sec);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.ata-row input,.ata-row textarea{width:100%;box-sizing:border-box;border:1.5px solid var(--z-border);border-radius:8px;padding:8px 11px;font-family:inherit;font-size:13px;color:var(--z-text);resize:vertical}
.ata-row input:focus,.ata-row textarea:focus{outline:none;border-color:var(--z-teal)}
.ata-texto{font-size:13px;color:var(--z-text);line-height:1.55;white-space:pre-wrap}
/* As anotações da ata usam o editor rico (mesmo da aba Copy). */
.ata-doc .rt-editor{min-height:120px}
.ata-doc .rt-editor.ro{border:none;background:none;padding:0;min-height:0}
.ata-prog{display:block;font-size:11px;color:var(--z-teal);margin-top:4px;min-height:14px}
.ata-del{margin-top:10px;background:none;border:1px solid var(--z-terra);color:var(--z-terra);border-radius:8px;padding:6px 12px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
.ata-add{align-self:flex-start;margin-top:4px;background:var(--z-teal-light);border:1.5px dashed var(--z-teal);color:var(--z-teal);border-radius:9px;padding:9px 14px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
/* Brainstorming: mesmo esqueleto das atas, com cara própria */
.ideias-panel .atas-head{background:#EFE9FA;border-bottom-color:#C9BCEC}
.ideias-panel .atas-count{background:#7F77DD;color:#fff}
.ideia-tipo{font-size:15px;flex-shrink:0}
.ideia-autor{font-size:10.5px;color:var(--z-text-sec);white-space:nowrap;flex-shrink:0}
.ideia-abas{display:flex;gap:6px;margin-bottom:8px}
.ideia-aba{display:inline-flex;align-items:center;gap:5px;font-family:inherit;font-size:11.5px;font-weight:600;color:var(--z-text-sec);background:#fff;border:1px solid var(--z-border);border-radius:20px;padding:5px 11px;cursor:pointer}
.ideia-aba.on{background:#7F77DD;border-color:#7F77DD;color:#fff}
.ideia-aba.on .mes-n{background:rgba(255,255,255,.24);color:#fff}
.ideia-acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ideia-usada{margin-top:10px;background:var(--z-teal-light);border:1px solid var(--z-teal);color:var(--z-teal);border-radius:8px;padding:6px 12px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
.ideia-rodape{font-size:10.5px;color:var(--z-text-sec);margin-top:9px}
.ata-item.ideia-ok .ata-titulo{text-decoration:line-through;opacity:.6}
.ideias-panel select{width:100%;padding:8px 10px;border:1px solid var(--z-border);border-radius:8px;font-family:inherit;font-size:13px;background:#fff;color:var(--z-text)}
.za-foot{padding:10px;border-top:1px solid var(--z-border);display:flex;gap:8px;background:#fff}
.za-inp{flex:1;border:1.5px solid var(--z-border);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:13px;color:var(--z-text);resize:none;max-height:80px}
.za-inp:focus{outline:none;border-color:var(--z-teal)}
.za-send{border:none;background:var(--z-teal);color:#fff;width:40px;border-radius:10px;cursor:pointer;font-size:15px}
.za-flash{animation:za-flash 1.7s ease}
@keyframes za-flash{0%,100%{box-shadow:0 1px 3px rgba(0,0,0,.05)}30%{box-shadow:0 0 0 3px var(--z-cyan)}}

/* LOADING / TOAST */
.loading{position:fixed;inset:0;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;z-index:100;font-size:13px;color:var(--z-text-sec)}
.loading.hide{display:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1A1A1A;color:#fff;font-size:13px;padding:10px 20px;border-radius:30px;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* DOC MODE */
.doc-card{background:#fff;border:0.5px solid var(--z-border);border-radius:12px;padding:1.5rem;margin-bottom:1.25rem;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.doc-card-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--z-teal);display:flex;align-items:center;gap:8px;margin-bottom:1rem}
.doc-card-title::after{content:'';flex:1;height:1px;background:var(--z-border)}
.doc-field{margin-bottom:12px}
.doc-label{font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--z-text-sec);margin-bottom:3px;text-transform:uppercase}
.doc-value{font-size:13px;color:var(--z-text);line-height:1.6;white-space:pre-line}
.doc-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.doc-pill{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;background:var(--z-teal-light);color:var(--z-teal)}
.doc-pill.terra{background:var(--z-terra-light);color:var(--z-terra)}
.doc-swot-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.doc-swot-card{border-radius:8px;padding:10px 12px;border-left:3px solid}
.doc-swot-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.doc-swot-body{font-size:12px;line-height:1.7;color:var(--z-text);white-space:pre-line}
.doc-ref-item{background:var(--z-bg);border-radius:8px;padding:10px;margin-bottom:6px;border-left:3px solid var(--z-teal)}
.doc-ref-nome{font-size:13px;font-weight:600;color:var(--z-text)}
.doc-ref-gosta{font-size:12px;color:var(--z-text-sec);margin-top:2px}
.doc-ref-link{font-size:11px;color:var(--z-teal);text-decoration:none;margin-left:6px}

/* ════ ABA COPY ════ */
.copy-cycle-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.copy-cycle-sel{font-size:12px;padding:6px 10px;border:1.5px solid var(--z-border);border-radius:8px;font-family:inherit;color:var(--z-text);background:#fff}
.copy-gabi-btn{font-size:11px;font-weight:600;padding:6px 11px;border-radius:8px;border:1px solid var(--z-terra);background:var(--z-terra-light);color:var(--z-terra);cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s}
.copy-gabi-btn:hover{background:#f0d5c0}
.copy-gabi-btn.copied{background:#d7f0e0;border-color:#1B6B3A;color:#1B6B3A}
.copy-card{background:#fff;border:0.5px solid var(--z-border);border-radius:12px;padding:1.1rem 1.15rem;margin-bottom:12px;border-left:3px solid var(--z-teal);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.cc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:.5rem}
.cc-toggle{cursor:pointer;margin:-1.1rem -1.15rem 0;padding:1.1rem 1.15rem;border-radius:11px 11px 0 0;transition:background .12s}
.cc-toggle:hover{background:var(--z-bg)}
.cc-head-right{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.cc-openhint{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#fff;background:var(--z-teal);padding:6px 12px;border-radius:20px;white-space:nowrap}
.cc-toggle:hover .cc-openhint{background:#0a6870}
.oh-close{display:none}
.copy-card.open .oh-open{display:none}
.copy-card.open .oh-close{display:inline}
.cc-chevron{font-size:10px;line-height:1;transition:transform .18s}
.copy-card.open .cc-chevron{transform:rotate(180deg)}
.cc-mini{font-size:10px!important;padding:3px 9px!important;cursor:default!important}
.cc-body{display:none;margin-top:.9rem}
.copy-card.open .cc-body{display:block}
.copy-card.open .cc-toggle{margin-bottom:0}
.vid-toggle-row{display:flex;justify-content:flex-end;margin-bottom:.6rem}
.cc-meta{min-width:0}
.cc-date{font-size:11px;font-weight:700;color:var(--z-terra)}
.cc-title{font-size:14px;font-weight:600;color:var(--z-text);line-height:1.25;margin:2px 0 5px}
.cc-tags{display:flex;flex-wrap:wrap;gap:5px}
.cc-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--z-teal-light);color:var(--z-teal)}
.cc-tag.fmt{background:var(--z-ocre-light);color:var(--z-ocre-dark)}
.vid-toggle{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--z-text-sec);cursor:pointer;user-select:none;padding:5px 11px;border:1.5px solid var(--z-border);border-radius:20px;white-space:nowrap;flex-shrink:0;transition:all .15s}
.vid-toggle.on{background:var(--z-terra-light);border-color:var(--z-terra);color:var(--z-terra)}
/* status chips */
.cc-status{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:.5rem 0 .9rem}
.st-group{display:flex;align-items:center;gap:4px}
.st-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--z-text-sec);margin-right:2px}
.st-chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;border:1.5px solid var(--z-border);background:#fff;color:var(--z-text-sec);cursor:pointer;font-family:inherit;transition:all .12s}
.st-chip.on.andamento{background:#FBF6E8;border-color:var(--z-ocre-dark);color:var(--z-ocre-dark)}
.st-chip.on.finalizado{background:#d7f0e0;border-color:#1B6B3A;color:#1B6B3A}
.st-chip.on.bloqueado{background:var(--z-terra-light);border-color:var(--z-terra);color:#8A4020}
/* decisão da Gabi */
.gabi-dec{display:flex;flex-wrap:wrap;gap:6px;margin:.3rem 0 1rem}
.gd-chip{font-size:11px;font-weight:600;padding:5px 11px;border-radius:20px;border:1.5px solid var(--z-border);background:#fff;color:var(--z-text-sec);cursor:pointer;font-family:inherit;transition:all .12s}
.gd-chip.on.validacao_necessaria{background:#EFEFEF;border-color:#8A8A8A;color:#4A4A4A}
.gd-chip.on.em_validacao{background:var(--z-teal-light);border-color:var(--z-teal);color:var(--z-teal)}
.gd-chip.on.revisao_necessaria{background:#FBF6E8;border-color:var(--z-ocre-dark);color:var(--z-ocre-dark)}
.gd-chip.on.aprovado{background:#d7f0e0;border-color:#1B6B3A;color:#1B6B3A}
.gd-chip.on.cancelado{background:var(--z-terra-light);border-color:var(--z-terra);color:#8A4020}
/* campos de copy */
.cf{margin-bottom:11px}
.cf-lbl{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--z-teal);margin-bottom:4px;display:block}
.cf textarea,.cf input[type=text]{width:100%;font-size:13px;padding:8px 10px;border:0.5px solid var(--z-border);border-radius:8px;font-family:inherit;line-height:1.55;color:var(--z-text);background:#fff;resize:vertical;box-sizing:border-box}
#copy-cards .cf textarea,#copy-cards .slide-card textarea{overflow-y:hidden;min-height:64px}
.cf textarea:focus,.cf input:focus{outline:none;border-color:var(--z-teal);box-shadow:0 0 0 2px rgba(17,128,140,.08)}
/* ── Editor rico do copy: texto, tabela e imagem no mesmo documento ────────── */
.rt-editor{width:100%;min-height:64px;font-size:13px;padding:8px 10px;border:0.5px solid var(--z-border);border-radius:8px;font-family:inherit;line-height:1.6;color:var(--z-text);background:#fff;box-sizing:border-box;white-space:pre-wrap;overflow-wrap:anywhere}
.rt-editor:focus{outline:none;border-color:var(--z-teal);box-shadow:0 0 0 2px rgba(17,128,140,.08)}
.rt-editor.ro{background:var(--z-bg)}
.slide-card .rt-editor{padding:6px 8px;border-radius:6px}
.slide-card .rt-editor:focus{border-color:var(--z-ocre-dark);box-shadow:0 0 0 2px rgba(154,122,31,.10)}
.rt-editor:empty::before{content:attr(data-ph);color:#bbb;pointer-events:none}
/* widget (tabela/imagem): bloco atômico dentro do texto */
/* white-space:normal é essencial: o editor usa pre-wrap, e sem isso a
   indentação do HTML do widget virava um monte de linha em branco na tela */
.rt-w{position:relative;display:block;margin:8px 0;user-select:none;white-space:normal}
.rt-w-tab{overflow-x:auto;-webkit-overflow-scrolling:touch}
.rt-w-tab .tb-card{margin-bottom:0}
.rt-w-img{max-width:320px}
.rt-w-img img{display:block;width:100%;border-radius:8px;border:1px solid var(--z-border)}
.rt-img-cap{display:block;font-size:11px;color:var(--z-text-sec);margin-top:3px;line-height:1.4}
.rt-w-x{position:absolute;top:4px;right:4px;z-index:2;width:20px;height:20px;border:none;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:11px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}
.rt-w-x:hover{background:var(--z-terra)}
.rt-tool{font-size:11px;font-weight:600;font-family:inherit;color:var(--z-teal);background:none;border:1px dashed var(--z-teal);border-radius:7px;padding:4px 10px;cursor:pointer;opacity:.8;transition:opacity .15s,background .15s}
.rt-tool:hover{opacity:1;background:var(--z-teal-light)}
.rtimg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:10px 0}
.rtimg-op{border:1px solid var(--z-border);border-radius:8px;background:#fff;padding:5px;cursor:pointer;font-family:inherit;font-size:10.5px;color:var(--z-text-sec)}
.rtimg-op:hover{border-color:var(--z-teal);color:var(--z-teal)}
.rtimg-op img{display:block;width:100%;height:70px;object-fit:cover;border-radius:5px;margin-bottom:4px}
/* slides */
.slide-card{background:var(--z-bg);border:0.5px solid var(--z-border);border-left:3px solid var(--z-ocre-dark);border-radius:8px;padding:9px 10px;margin-bottom:8px}
.slide-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.slide-num{font-size:10px;font-weight:700;color:var(--z-ocre-dark);text-transform:uppercase;letter-spacing:.05em}
.slide-del{font-size:11px;color:var(--z-terra);background:none;border:none;cursor:pointer;font-family:inherit;padding:2px 6px;border-radius:4px}
.slide-del:hover{background:var(--z-terra-light)}
.slide-card textarea{width:100%;font-size:13px;padding:6px 8px;border:0.5px solid var(--z-border);border-radius:6px;font-family:inherit;line-height:1.55;background:#fff;color:var(--z-text);resize:vertical;box-sizing:border-box}
.slide-card textarea:focus{outline:none;border-color:var(--z-ocre-dark)}
/* bloco read-only (validação) */
.vslide-num{font-size:10px;font-weight:700;color:var(--z-ocre-dark);text-transform:uppercase;letter-spacing:.05em;margin:8px 0 3px}
/* Seleção rápida por mês (Copy / Conteúdos) */
.mes-bar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:0 0 1rem}
.mes-lbl{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--z-text-sec);margin-right:2px}
.mes-chip{display:inline-flex;align-items:center;gap:5px;font-family:inherit;font-size:12px;font-weight:600;color:var(--z-text-sec);background:#fff;border:1px solid var(--z-border);border-radius:20px;padding:5px 12px;cursor:pointer;transition:all .15s}
.mes-chip:hover{border-color:var(--z-teal);color:var(--z-teal)}
.mes-chip.on{background:var(--z-teal);border-color:var(--z-teal);color:#fff}
.mes-n{font-size:10px;font-weight:700;background:var(--z-bg);color:var(--z-text-sec);border-radius:20px;padding:1px 6px}
.mes-chip.on .mes-n{background:rgba(255,255,255,.24);color:#fff}
/* Painel "o que está esperando você" (topo da Base de Dados) */
.pd-panel{background:#fff;border:1px solid var(--z-terra);border-radius:12px;margin-bottom:1.1rem;overflow:hidden}
.pd-panel.ok{border-color:var(--z-border)}
.pd-head{display:flex;align-items:center;gap:9px;padding:11px 14px;cursor:pointer;background:var(--z-terra-light)}
.pd-panel.ok .pd-head{background:var(--z-bg);cursor:default}
.pd-ico{font-size:15px}
.pd-t{font-size:13px;font-weight:800;color:var(--z-text);flex:1}
.pd-total{font-size:11px;font-weight:800;background:var(--z-terra);color:#fff;border-radius:20px;padding:2px 9px}
.pd-load{font-size:11px;color:var(--z-text-sec)}
.pd-chev{font-size:11px;color:var(--z-text-sec)}
.pd-body{padding:4px 6px 8px}
/* Só aparece com o painel aberto — é a legenda da lista, não do cabeçalho. */
.pd-janela-bar{font-size:10.5px;color:var(--z-text-sec);padding:7px 14px 5px;border-bottom:1px solid var(--z-border)}
.pd-janela{font-size:10.5px;color:var(--z-text-sec)}
/* Nome do ciclo como cabeçalho do grupo: antes ele se repetia em toda linha. */
.pd-grupo{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--z-text-sec);padding:9px 10px 4px}
.pd-grupo:first-child{padding-top:5px}
.pd-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-family:inherit;background:none;border:none;border-radius:8px;padding:8px 10px;cursor:pointer;transition:background .15s}
.pd-row:hover{background:var(--z-bg)}
.pd-n{flex:0 0 26px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;color:var(--z-text-sec);background:var(--z-bg);border-radius:20px}
.pd-row.urg .pd-n{background:var(--z-terra);color:#fff}
.pd-txt{flex:1;font-size:12.5px;color:var(--z-text);line-height:1.35}
.pd-go{font-size:13px;color:var(--z-text-sec)}
.pd-row:hover .pd-go{color:var(--z-teal)}
/* Busca por título + filtro por situação */
.filtro-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 1rem}
.busca-wrap{position:relative;display:flex;align-items:center;flex:1 1 240px;max-width:340px}
.busca-ico{position:absolute;left:10px;font-size:12px;opacity:.55;pointer-events:none}
.busca-inp{width:100%;font-family:inherit;font-size:12.5px;padding:7px 28px 7px 30px;border:1px solid var(--z-border);border-radius:20px;background:#fff;color:var(--z-text);box-sizing:border-box}
.busca-inp:focus{outline:none;border-color:var(--z-teal)}
.busca-inp::-webkit-search-cancel-button{display:none}
.busca-x{position:absolute;right:8px;border:none;background:none;color:var(--z-text-sec);font-size:12px;cursor:pointer;padding:2px 4px;line-height:1}
.busca-x:hover{color:var(--z-terra)}
.st-fchips{display:flex;flex-wrap:wrap;gap:6px}
.st-fchip{display:inline-flex;align-items:center;gap:5px;font-family:inherit;font-size:11.5px;font-weight:600;color:var(--z-text-sec);background:#fff;border:1px solid var(--z-border);border-radius:20px;padding:5px 11px;cursor:pointer;transition:all .15s}
.st-fchip:hover{border-color:var(--z-terra);color:var(--z-terra)}
.st-fchip.on{background:var(--z-terra);border-color:var(--z-terra);color:#fff}
.st-fchip.on .mes-n{background:rgba(255,255,255,.24);color:#fff}
.cf-cmt-dica{font-size:9.5px;font-weight:600;color:var(--z-terra);background:var(--z-terra-light);border-radius:20px;padding:2px 8px;margin-left:8px;text-transform:none;letter-spacing:0;white-space:nowrap}
.vblock{font-size:13px;line-height:1.7;color:var(--z-text);white-space:pre-wrap;background:var(--z-bg);border:0.5px solid var(--z-border);border-radius:8px;padding:9px 11px;cursor:text}
/* Texto-fonte escondido: some da tela mas continua contando na posição dos comentários */
.vsrc{display:none}
.vimg{display:block;margin:8px 0}
.vimg img{max-width:100%;border-radius:8px;border:0.5px solid var(--z-border);display:block}
.vimg-cap{display:block;font-size:11px;color:var(--z-text-sec);margin-top:4px;font-style:italic}
.vtab{border-collapse:collapse;margin:8px 0;font-size:12.5px;background:#fff;border-radius:8px;overflow:hidden;display:block;max-width:100%;overflow-x:auto;white-space:normal}
.vtab th,.vtab td{border:0.5px solid var(--z-border);padding:6px 10px;text-align:left;vertical-align:top}
.vtab td{white-space:pre-wrap}
/* Galeria de imagens do copy */
.ci-grid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.ci-item{width:150px}
.ci-thumb{position:relative;border-radius:8px;overflow:hidden;border:0.5px solid var(--z-border);background:var(--z-bg)}
.ci-thumb img{width:100%;height:96px;object-fit:cover;display:block}
.ci-num{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px}
.ci-leg{width:100%;margin-top:5px;font-size:11px;padding:5px 7px;border:0.5px solid var(--z-border);border-radius:6px;font-family:inherit;box-sizing:border-box;color:var(--z-text)}
.ci-leg-ro{font-size:11px;color:var(--z-text-sec);margin-top:4px;font-style:italic}
.ci-ins{width:100%;margin-top:4px;font-size:10.5px;font-weight:700;padding:5px;border:1px solid var(--z-teal);background:var(--z-teal-light);color:var(--z-teal);border-radius:6px;cursor:pointer;font-family:inherit}
.ci-ins:hover{background:#d3ebee}
/* Grade simples, no espirito da tabela do Google Docs: celulas todas iguais,
   sem cabecalho especial e sem enfeite. As alcas de remover so aparecem no hover. */
.tb-card{margin:8px 0;background:#fff}
.tb-edit{border-collapse:collapse;width:100%;table-layout:fixed}
.tb-edit td{border:1px solid #C9C2B4;padding:0;vertical-align:top}
.tb-edit textarea{display:block;width:100%;border:none;background:transparent;padding:7px 9px;font-family:inherit;font-size:12.5px;line-height:1.5;color:var(--z-text);box-sizing:border-box;resize:none;overflow-y:auto;min-height:34px;overflow-wrap:break-word}
.tb-edit textarea:focus{outline:2px solid var(--z-teal);outline-offset:-2px;background:#fff}
/* a célula não pode herdar o min-height dos campos grandes de texto do slide */
#copy-cards .tb-edit textarea{min-height:34px}
.tb-x{border:none;background:none;color:var(--z-text-sec);cursor:pointer;font-size:9px;padding:2px 4px;opacity:0;line-height:1;transition:opacity .12s}
.tb-card:hover .tb-x{opacity:.45}
.tb-x:hover{opacity:1!important;color:var(--z-terra)}
.tb-alca{border:none!important;width:20px;text-align:center;background:none!important}
.tb-alcas td{border:none!important;height:14px}
.tb-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;opacity:0;transition:opacity .12s}
.tb-card:hover .tb-acts,.tb-card:focus-within .tb-acts{opacity:1}
.tb-del-btn:hover{border-color:var(--z-terra)!important;color:var(--z-terra)!important}
.tb-btn{font-size:11px;font-weight:600;padding:6px 11px;border:0.5px solid var(--z-border);background:var(--z-bg);color:var(--z-text-sec);border-radius:7px;cursor:pointer;font-family:inherit}
.tb-btn:hover{border-color:var(--z-teal);color:var(--z-teal)}
.tb-btn.tb-ins{border-color:var(--z-teal);background:var(--z-teal-light);color:var(--z-teal);font-weight:700}
/* Tabela ancorada no campo: entra logo abaixo do texto, com um "fio" ligando os dois */
.tb-dica{font-size:10.5px;color:var(--z-text-sec);align-self:center;line-height:1.35}
.vtab-wrap{display:block;margin:8px 0}
.vtab-cap{display:block;font-size:11px;font-weight:700;color:var(--z-teal);margin-bottom:4px}
.vblock-empty{color:#bbb;font-size:12px}
mark.cmt{background:#FBEEE4;border-bottom:2px solid var(--z-terra);color:inherit;cursor:pointer;border-radius:2px;padding:0 1px}
mark.cmt:hover{background:#f6d9c4}
/* lista de comentários */
.cmt-list{margin-top:7px;display:flex;flex-direction:column;gap:6px}
.cmt-item{background:#fff;border:1px solid var(--z-terra);border-left:3px solid var(--z-terra);border-radius:7px;padding:7px 9px;transition:box-shadow .2s}
.cmt-item.cmt-flash{box-shadow:0 0 0 2px var(--z-terra)}
.cmt-quote{font-size:11px;color:var(--z-terra);font-style:italic;border-left:2px solid var(--z-terra);padding-left:6px;margin-bottom:3px}
.cmt-texto{font-size:12px;color:var(--z-text);line-height:1.45}
.cmt-foot{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.cmt-meta{font-size:10px;color:var(--z-text-sec)}
.cmt-resolve{font-size:11px;color:var(--z-teal);background:none;border:none;cursor:pointer;font-family:inherit;padding:0;font-weight:600}
/* popover */
.cmt-pop{position:absolute;z-index:500;background:#fff;border:1px solid var(--z-border);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:10px;width:240px;display:none}
.cmt-pop-t{font-size:11px;font-weight:800;color:var(--z-terra);margin-bottom:6px}
.cmt-pop textarea{width:100%;font-size:12px;padding:6px 8px;border:0.5px solid var(--z-border);border-radius:6px;font-family:inherit;resize:vertical;margin-bottom:6px;color:var(--z-text)}
.cmt-pop textarea:focus{outline:none;border-color:var(--z-terra)}
.pop-actions{display:flex;gap:6px;justify-content:flex-end}
.cmt-pop button{font-size:11px;font-weight:600;padding:5px 11px;border-radius:6px;border:none;cursor:pointer;font-family:inherit}
.pop-save{background:var(--z-terra);color:#fff}
.pop-cancel{background:var(--z-bg);color:var(--z-text-sec)}
/* hint do modo validação (cliente) */
.copy-hint{background:var(--z-terra-light);border:1px solid var(--z-terra);border-radius:10px;padding:10px 13px;margin-bottom:1.1rem;font-size:12px;color:var(--z-text);line-height:1.5}
/* Instrução da Gabi: "selecione e escreva", em passos, para não passar batido */
.copy-hint.howto{padding:13px 15px}
.howto-t{font-size:13px;font-weight:800;color:var(--z-terra);margin-bottom:9px}
.howto-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px}
.howto-step{display:flex;gap:8px;align-items:flex-start;background:#fff;border:1px solid rgba(217,129,78,.35);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45}
.howto-n{flex:0 0 18px;height:18px;border-radius:50%;background:var(--z-terra);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.howto-ex{display:block;font-size:11px;color:var(--z-text-sec);margin-top:2px}
.howto-mark{background:#FFE2CD;border-bottom:2px solid var(--z-terra);padding:0 3px;border-radius:2px}
.howto-foot{font-size:11.5px;color:var(--z-text-sec);margin-top:9px;line-height:1.5}
/* Deixa visível que o texto é "selecionável para comentar" */
.vblock.vb-cmt:hover{background:#fff;border-color:var(--z-terra);box-shadow:inset 0 0 0 1px rgba(217,129,78,.18)}
.vblock.vb-cmt::selection,.vblock.vb-cmt *::selection{background:#FFD9BE}
.copy-imp-btn{margin-left:auto;padding:8px 13px;font-size:12px;border-radius:8px;border:1px solid var(--z-terra);background:#fff;color:var(--z-terra);font-family:inherit;font-weight:600;cursor:pointer}
.copy-imp-btn:hover{background:var(--z-terra-light)}
/* Barra de formatação do copy (Unicode + emoji) */
.fmtbar{position:sticky;top:8px;z-index:20;display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#fff;border:1px solid var(--z-border);border-radius:10px;padding:7px 9px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.fmtb{min-width:30px;height:30px;padding:0 9px;border:1px solid var(--z-border);background:var(--z-bg);border-radius:7px;cursor:pointer;font-size:14px;font-family:inherit;color:var(--z-text);display:inline-flex;align-items:center;justify-content:center}
.fmtb:hover{background:var(--z-teal-light);border-color:var(--z-teal)}
.fmt-hint{font-size:11px;color:var(--z-text-sec);margin-left:auto}
.fmt-emojis{flex-basis:100%;display:block;margin-top:6px;border-top:1px solid var(--z-border);padding-top:6px;max-height:230px;overflow-y:auto}
.fmt-emo-grupo{margin-bottom:6px}
.fmt-emo-lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--z-text-sec);margin-bottom:2px}
.fmt-emo-row{display:flex;flex-wrap:wrap;gap:2px}
.fmt-emo{width:32px;height:30px;border:none;background:none;cursor:pointer;font-size:18px;border-radius:6px;line-height:1}
.fmt-emo:hover{background:var(--z-teal-light)}
/* Dentro de uma ata a barra fica no corpo do item — grudar no topo da página
   faria ela flutuar por cima do painel inteiro. */
.fmtbar.fmt-inline{position:static;box-shadow:none;margin-bottom:8px;background:var(--z-bg)}
@media(max-width:620px){.fmt-hint{display:none}}
.impc-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:3000;align-items:center;justify-content:center;padding:16px}
.impc-box{background:#fff;border-radius:12px;padding:18px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.impc-box h3{font-size:15px;color:var(--z-teal);margin:0 0 4px}
.impc-box p{font-size:12px;color:var(--z-text-sec);margin:0 0 12px}
.impc-box textarea{width:100%;height:150px;font-family:ui-monospace,monospace;font-size:11px;border:1px solid var(--z-border);border-radius:8px;padding:8px;resize:vertical;box-sizing:border-box}
.impc-box input[type=file]{display:block;font-size:12px;margin:8px 0}
.impc-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.impc-actions button{padding:9px 16px;font-size:13px;border-radius:8px;font-family:inherit;font-weight:600;cursor:pointer;border:1px solid var(--z-border);background:#fff;color:var(--z-text-sec)}
.impc-actions .impc-go{border-color:var(--z-teal);background:var(--z-teal);color:#fff}
/* banner da Gabi */
.gabi-banner{background:var(--z-terra-light);border:1px solid var(--z-terra);border-radius:12px;padding:14px 16px;margin-bottom:1.25rem}
.gabi-banner-title{font-size:14px;font-weight:700;color:var(--z-terra);margin-bottom:3px}
.gabi-banner-text{font-size:12px;color:var(--z-text);line-height:1.55}

/* ════ ABA DESIGN ════ */
.dz-area{margin:.4rem 0 1rem}
.dz-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.dz-thumb{position:relative;width:64px;height:78px;border-radius:8px;overflow:hidden;border:0.5px solid var(--z-border);background:var(--z-bg)}
.dz-thumb img,.dz-thumb video{width:100%;height:64px;object-fit:cover;display:block}
.dz-thumb.dz-video{border-color:var(--z-terra)}
.dz-vtag{position:absolute;top:2px;left:2px;background:rgba(217,129,78,.92);color:#fff;font-size:8.5px;font-weight:700;padding:1px 5px;border-radius:20px;line-height:1.4}
.dz-del{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:10px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}

.dz-ordhint{font-size:11px;color:var(--z-text-sec);margin-top:6px;line-height:1.4}
.dz-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:8px 14px;border-radius:8px;border:1px dashed var(--z-teal);background:var(--z-teal-light);color:var(--z-teal);cursor:pointer;font-family:inherit}
.dz-btn:hover{background:#d3ebee}
.dz-progress{font-size:11px;color:var(--z-text-sec);margin-left:10px}
.dz-erro{display:flex;align-items:flex-start;gap:8px;background:#FDECE4;border:1px solid var(--z-terra);border-radius:8px;padding:9px 11px;margin-top:8px;font-size:12px;line-height:1.5;color:#7A3B18}
.dz-erro-ico{font-size:13px;flex:0 0 auto}
.dz-erro-x{margin-left:auto;border:none;background:none;color:#7A3B18;font-size:12px;cursor:pointer;padding:0 2px;line-height:1}
.prev-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:.3rem 0 .5rem}
@media(max-width:620px){.prev-grid{grid-template-columns:1fr}}
.car-block{min-width:0}
.car-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--z-text-sec);margin-bottom:5px}
.car-frame{background:#fff;border:0.5px solid var(--z-border);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.ig-head{display:flex;align-items:center;gap:8px;padding:8px 10px;height:48px;box-sizing:border-box}
.ig-ava{width:26px;height:26px;border-radius:50%;background:linear-gradient(45deg,var(--z-terra),var(--z-ocre),var(--z-cyan));flex-shrink:0}
.ig-user{font-size:12px;font-weight:700;color:var(--z-text);flex:1}
.ig-more{color:var(--z-text-sec);font-size:12px}
.li-head{display:flex;align-items:center;gap:8px;padding:9px 10px;height:48px;box-sizing:border-box}
.li-ava{width:30px;height:30px;border-radius:6px;background:#0A66C2;color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-style:italic}
.li-user{font-size:12px;font-weight:700;color:var(--z-text);line-height:1.1}
.li-sub{font-size:10px;color:var(--z-text-sec)}
.car-stage{position:relative;background:#000}
.car-viewport{position:relative;width:100%;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden;aspect-ratio:4/5}
.car-viewport.is-reels{aspect-ratio:9/16}
.car-viewport img,.car-viewport video{width:100%;height:100%;object-fit:contain;display:block;background:#111}
.car-empty{color:#999;font-size:12px;background:var(--z-bg)!important}
.car-arrow{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:none;background:rgba(255,255,255,.85);color:#222;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;z-index:2}
.car-arrow.left{left:6px}.car-arrow.right{right:6px}
.car-arrow:hover{background:#fff}
.car-foot{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:#fff}
.car-dots{display:flex;gap:4px;flex-wrap:wrap}
.car-dot{width:6px;height:6px;border-radius:50%;background:var(--z-border)}
.car-dot.on{background:var(--z-teal)}
.car-counter{font-size:11px;color:var(--z-text-sec);font-weight:600}
.enviar-row{display:flex;align-items:center;gap:10px;margin-top:.7rem}
.enviar-btn{font-size:12px;font-weight:700;padding:9px 16px;border-radius:8px;border:none;background:var(--z-teal);color:#fff;cursor:pointer;font-family:inherit;transition:background .15s}
.enviar-btn:hover{background:#0A6870}
.enviado-tag{font-size:11px;font-weight:600;color:#1B6B3A}
.avisar-btn{margin-left:auto;font-size:12px;font-weight:700;padding:9px 15px;border-radius:8px;border:none;background:var(--z-terra);color:#fff;cursor:pointer;font-family:inherit;transition:filter .15s;white-space:nowrap}

.gd-chip.on.em_analise{background:var(--z-teal-light);border-color:var(--z-teal);color:var(--z-teal)}
.gd-chip.on.ajustes_necessarios{background:#FBF6E8;border-color:var(--z-ocre-dark);color:var(--z-ocre-dark)}

/* ════ ABA MÉTRICAS ════ */
.mx-viewtoggle{display:flex;gap:6px;margin-bottom:1rem}
.mx-vbtn{font-size:12px;font-weight:600;padding:7px 14px;border-radius:8px;border:1.5px solid var(--z-border);background:#fff;color:var(--z-text-sec);cursor:pointer;font-family:inherit}
.mx-vbtn.on{background:var(--z-teal);border-color:var(--z-teal);color:#fff}
.mx-updated{font-size:12px;color:var(--z-text-sec);margin-bottom:.9rem}
.mx-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.25rem}
@media(max-width:640px){.mx-cards{grid-template-columns:repeat(2,1fr)}}
.mx-card{background:#fff;border:0.5px solid var(--z-border);border-top:3px solid var(--z-teal);border-radius:12px;padding:.9rem 1rem;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.mx-card-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--z-text-sec);min-height:2.4em}
.mx-card-auto{margin-top:3px}
.mx-card-val{font-size:24px;font-weight:800;color:var(--z-text);line-height:1.1;margin:6px 0 4px;letter-spacing:-.02em}

.mx-card-vs{font-size:10px;color:#9AA0A6}
.mx-chartwrap{background:#fff;border:0.5px solid var(--z-border);border-radius:12px;padding:1rem 1.1rem;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.mx-chart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:.6rem}
.mx-chart-title{font-size:12px;font-weight:700;color:var(--z-text)}
.mx-mchips{display:flex;flex-wrap:wrap;gap:5px}
.mx-mchip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;border:1.5px solid var(--z-border);background:#fff;color:var(--z-text-sec);cursor:pointer;font-family:inherit}
.mx-mchip.on{background:var(--z-teal-light);border-color:var(--z-teal);color:var(--z-teal)}
.mx-chart{width:100%;height:auto;display:block}
.mx-bar{transition:opacity .12s}.mx-bar:hover{opacity:.75}
.mx-empty{font-size:12px;color:var(--z-text-sec);padding:1.5rem;text-align:center}
.mx-hint{font-size:12px;color:var(--z-text-sec);margin-bottom:.8rem;background:var(--z-teal-light);border:1px solid rgba(17,128,140,.25);border-radius:8px;padding:8px 12px;line-height:1.5}
.mx-table-wrap{overflow-x:auto;margin-bottom:10px}
.mx-table{border-collapse:collapse;width:100%;font-size:12px}
.mx-table th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--z-text-sec);text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--z-border);white-space:nowrap}
.mx-table td{padding:4px 6px;border-bottom:0.5px solid var(--z-border)}
.mx-table input{width:100%;min-width:78px;font-size:12px;padding:6px 8px;border:0.5px solid var(--z-border);border-radius:6px;font-family:inherit;color:var(--z-text);background:#fff}
.mx-table input:focus{outline:none;border-color:var(--z-teal)}
.mx-del{font-size:12px;color:var(--z-terra);background:none;border:none;cursor:pointer;font-family:inherit;padding:4px 6px;border-radius:4px}
.mx-del:hover{background:var(--z-terra-light)}
.mx-granbar{display:flex;gap:6px;margin-bottom:1rem;border-radius:10px;overflow:hidden;border:1.5px solid var(--z-teal)}
.mx-gbtn{flex:1;padding:9px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;border:none;background:#fff;color:var(--z-teal);transition:all .15s}
.mx-gbtn.on{background:var(--z-teal);color:#fff}
.mx-gbtn:not(.on):hover{background:var(--z-teal-light)}
.mx-card-calc{background:var(--z-teal-light)}
.mx-calc-tag{font-size:8px;font-weight:700;background:var(--z-teal);color:#fff;padding:1px 5px;border-radius:10px;vertical-align:middle;letter-spacing:.03em}
/* por conteúdo */
.pm-card{padding:1rem 1.15rem}
.pm-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:.6rem 0}
@media(max-width:640px){.pm-grid{grid-template-columns:repeat(2,1fr)}}
.pm-field label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--z-text-sec);margin-bottom:3px}
.pm-field input{width:100%;font-size:13px;padding:7px 8px;border:0.5px solid var(--z-border);border-radius:7px;font-family:inherit;color:var(--z-text);background:#fff}
.pm-field input:focus{outline:none;border-color:var(--z-teal)}
.pm-ro{font-size:14px;font-weight:700;color:var(--z-text);padding:5px 0}
.pm-calc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:.4rem}
.pm-calc-card{background:var(--z-teal-light);border:1px solid rgba(17,128,140,.25);border-radius:10px;padding:9px 12px}
.pm-calc-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--z-teal)}
.pm-calc-val{font-size:20px;font-weight:800;color:var(--z-teal);letter-spacing:-.01em;margin-top:2px}
.pm-calc-sub{font-size:10px;color:var(--z-text-sec);margin-top:2px}
/* Resumo do ciclo */
.rc-best{margin-top:.9rem;background:var(--z-ocre-light);border:1px solid var(--z-ocre);border-radius:10px;padding:11px 14px}
.rc-best-lbl{font-size:11px;font-weight:700;color:var(--z-ocre-dark);margin-bottom:3px}
.rc-rank-item{display:flex;gap:10px;align-items:flex-start;margin-top:8px;padding-top:8px;border-top:1px solid rgba(154,122,31,.25)}
.rc-rank-item:first-of-type{margin-top:6px;padding-top:0;border-top:none}
.rc-rank{flex-shrink:0;width:20px;height:20px;border-radius:50%;background:var(--z-ocre);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.rc-chart{margin-top:1rem;background:#fff;border:0.5px solid var(--z-border);border-radius:12px;padding:12px 14px}
.rc-chart-title{font-size:12px;font-weight:700;color:var(--z-text);margin-bottom:6px}
.rc-chart-n{font-size:10px;font-weight:700;color:var(--z-teal);background:var(--z-teal-light);border-radius:20px;padding:2px 8px;margin-left:6px}
.mx-legend2{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:8px}
.mx-legend2 span{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--z-text-sec)}
.mx-legend2 i{width:11px;height:11px;border-radius:3px;display:inline-block}
.mx-legend2 i.ln{height:3px;width:16px;border-radius:2px}
.rc-chart-scroll{padding-bottom:4px}
.mx-chart2.rola{width:auto;max-width:none;height:auto}
.mx-hit{cursor:pointer}
.mx-tip{margin-top:6px;background:var(--z-bg);border:1px solid var(--z-border);border-radius:8px;padding:8px 10px;font-size:11.5px;line-height:1.45;color:var(--z-text)}
.mx-tip strong{display:block;color:var(--z-teal);margin-bottom:2px}
.mx-tip span{color:var(--z-text-sec)}
.mx-chart2{display:block;width:100%;height:auto;margin:0 auto}
.rc-chart-note{font-size:10.5px;color:var(--z-text-sec);margin-top:6px;line-height:1.45}
.rc-best-body{display:flex;flex-direction:column;gap:2px}
.rc-best-body strong{font-size:14px;color:var(--z-text)}
.rc-best-body span{font-size:12px;color:var(--z-text-sec)}
.rc-manual{margin-top:1rem;border:1px solid var(--z-border);border-radius:10px;padding:12px 14px}
.rc-manual-title{font-size:12px;font-weight:700;color:var(--z-teal);margin-bottom:8px}
.rc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rc-field label{display:block;font-size:11px;font-weight:600;color:var(--z-text-sec);margin-bottom:4px}
.rc-field input{width:100%;padding:8px 10px;border:1px solid var(--z-border);border-radius:8px;font-family:inherit;font-size:14px;box-sizing:border-box}

/* ══ CELULAR ══════════════════════════════════════════════════════════════════
   A Gabi valida quase tudo pelo telefone. Aqui o menu deixa de ser uma linha
   só (que estourava a caixa), os alvos de toque crescem e nada mais empurra a
   página para os lados. */
@media(max-width:620px){
  body{-webkit-text-size-adjust:100%;padding:.6rem}
  .container{padding:.25rem 0 5.5rem}
  .shell{gap:.75rem}
  .sidebar{padding:.9rem}
  .brand-logo{width:104px}
  /* MENU FIXO EM BAIXO: fica sempre ao alcance do polegar e nao vai embora com
     a rolagem. So os icones — o nome de cada aba vira title/aria-label. */
  .side-nav{position:fixed;left:0;right:0;bottom:0;z-index:1100;flex-direction:row;
    justify-content:space-around;align-items:stretch;gap:0;margin:0;
    background:rgba(255,255,255,.97);backdrop-filter:saturate(180%) blur(10px);
    border-top:1px solid var(--z-border);box-shadow:0 -2px 14px rgba(0,0,0,.07);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .nav-item{width:auto;flex:1 1 0;min-width:0;flex-direction:column;justify-content:center;
    gap:0;padding:8px 2px;border-radius:12px;min-height:48px;background:transparent}
  .nav-item .nav-lbl{display:none}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function getByPath(obj, path) {
  return path.split('.').reduce((o, k) => (o != null && o[k] !== undefined ? o[k] : ''), obj);
}
function setByPath(obj, path, val) {
  const keys = path.split('.');
  const last = keys.pop();
  const target = keys.reduce((o, k) => o[k], obj);
  if (target != null) target[last] = val;
}
function showToast(msg) {

async function salvarNoFirebase() {
  if (bloqueiaGravacaoLocal()) return;
  try {
    // Registra quem salvou — a Visualização mostra isso numa faixa no topo, para
    // dar para ver de relance quando o cliente acrescentou alguma coisa.
    estado.meta = { ultimaEdicao: { por: USER_EMAIL || '', em: new Date().toISOString(), role: ROLE } };
    await setDoc(DOC_REF, { ...estado, updatedAt: new Date().toISOString() });
    const el = document.getElementById('save-status');
    if (el) { el.textContent = '✓ Salvo'; el.classList.remove('saving'); }
    const bar = document.getElementById('save-bar');
    if (bar) {
      const t = new Date().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
      bar.className = 'save-bar saved';
      bar.innerHTML = `<span class="save-bar-ico">✓</span> Tudo salvo às ${t}`;
    }
    setTimeout(() => {
      const e2 = document.getElementById('save-status');
      if (e2) e2.textContent = '';
    }, 2500);
  } catch (e) {
    showToast('Erro ao salvar. Verifique a conexão.');
    const bar = document.getElementById('save-bar');
    if (bar) { bar.className = 'save-bar error'; bar.innerHTML = '<span class="save-bar-ico">⚠</span> Erro ao salvar — verifique a conexão'; }
    console.error(e);
  }
}

// ── FIELD HELPER ─────────────────────────────────────────────────────────────
function fld(label, path, placeholder, type, rows) {
  const val = esc(String(getByPath(estado, path) || ''));
  const ph = esc(placeholder || '');
  const attrs = `data-path="${path}" oninput="updateField(this)"`;
  const inp = (type === 'textarea')
    ? `<textarea rows="${rows || 3}" placeholder="${ph}" ${attrs}>${val}</textarea>`
    : `<input type="text" value="${val}" placeholder="${ph}" ${attrs}>`;
  return `<div class="fld"><label class="fl">${label}</label>${inp}</div>`;
}

function slugCiclo(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/[^\x00-\x7f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || ('ciclo-' + Date.now());
}
window.abrirAddCiclo = function() { addCicloOpen = true; renderSecM(); const el = document.getElementById('acf-periodo'); if (el) el.focus(); };
window.cancelarAddCiclo = function() { addCicloOpen = false; renderSecM(); };
window.salvarNovoCiclo = function() {
  const per = (document.getElementById('acf-periodo')?.value || '').trim();
  const cic = (document.getElementById('acf-ciclo')?.value || '').trim();
  if (!per) { showToast('Informe o período do ciclo.'); return; }
  const usados = (estado.planejamentos || []).map(cicloDocId);
  let base = slugCiclo(per), docId = base, n = 2;
  while (usados.includes(docId)) { docId = base + '-' + n; n++; }
  estado.planejamentos = estado.planejamentos || [];
  estado.planejamentos.push({ periodo: per, ciclo: cic, docId, ano: anoAtivo, status: 'em andamento' });
  agendarSalvamento();
  addCicloOpen = false;
  renderSecM();
  showToast('Ciclo adicionado ✓');
};
// Só os ciclos criados à mão podem ser excluídos (os padrão fazem parte da estrutura).
function cicloEhBase(docId) { return [...CICLOS_2026, ...CICLOS_2027].some(c => c.docId === docId); }
window.removerCiclo = async function(docId) {
  const p = (estado.planejamentos || []).find(x => cicloDocId(x) === docId);
  if (!p) return;
  if (!confirm(`Excluir o ciclo "${p.periodo}"${p.ciclo ? ` (${p.ciclo})` : ''}?\n\nRemove o ciclo do HUB e apaga a grade dele. Não dá para desfazer.`)) return;
  estado.planejamentos = (estado.planejamentos || []).filter(x => cicloDocId(x) !== docId);
  if (planOpen) planOpen = null;
  agendarSalvamento();
  try { await deleteDoc(doc(db, 'planejamentos', docId)); } catch (e) { console.warn('Falha ao apagar a grade do ciclo', e); }

};

name: Lembrete de prazo (Zelo HUB)

# DESATIVADO (a pedido do Vitor): o lembrete automático diário foi desligado.
# A validação passa a ser avisada MANUALMENTE, pelo botão "Avisar a Gabi das
# novidades" dentro do HUB (Planejamento / Copy / Conteúdos).
# Para reativar o resumo automático, descomente o bloco `schedule` abaixo.
on:
  # schedule:
  #   - cron: '0 12 * * *'   # 12:00 UTC = 09:00 (Brasília), todo dia
  workflow_dispatch:          # só roda se disparado manualmente pela aba Actions

permissions:
  contents: read

concurrency:
  group: lembrete-prazo
  cancel-in-progress: false

jobs:
  lembrete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências
        working-directory: .github/scripts
        run: npm install --no-audit --no-fund
      - name: Rodar lembrete
        working-directory: .github/scripts
        run: node lembrete-prazo.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          # Opcionais (têm padrão no script):
          # LEMBRETE_DESTINOS: "consultoria.zelo@gmail.com,vitort2210@gmail.com"
          # DIAS_AVISO: "14"
